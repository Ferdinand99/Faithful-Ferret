[unlock]
tab = "Unlock"
title = "Unlock"
sub = "The server’s rule for unlocking with a PIN. The browser extension reads it from the server and keeps to it."
pin_title = "PIN"
pin_allowed = "Allow PIN"
pin_allowed_help = "The emergency switch. Turn it off and every PIN is deleted on each device at its next contact with the server."
pin_after_restart = "Allow PIN after restart"
pin_after_restart_help = "On: a PIN is kept encrypted on the user’s computer and works after a restart of the browser. Off: a PIN is kept in memory only and is gone at restart."
min_length = "Shortest PIN"
min_length_unit = "characters"
min_length_help = "From 4 to 64. A PIN that is shorter than this is refused, and a shorter PIN that was set before is deleted."
min_error = "Enter a whole number from 4 to 64."
save = "Save"
saved = "The unlock rule was saved."
unchanged = "Nothing was changed."
confirm_title = "This rule is stricter"
confirm_intro = "Saving it deletes the PINs that no longer fit, on each device at its next contact with the server:"
confirm_min = "Raising the shortest PIN to {n} characters deletes every PIN that is shorter."
confirm_off = "Turning off Allow PIN deletes every PIN."
confirm_restart = "Turning off Allow PIN after restart deletes every PIN that is kept on disk. A new PIN is then kept in memory only."
confirm_outro = "Select Save again to confirm. Nothing is saved until you do."
explain_title = "What the rule means"
explain_disk = "By default the extension keeps a PIN encrypted on the user’s own computer, so it works after a restart of the browser and without a network. A PIN is much weaker than the master password because it has far fewer combinations."
explain_cost = "A PIN of at least {length} digits has {combos} combinations. Anyone who gets a copy of a user’s browser profile can try all of them in {one} with one powerful computer, and in {many} with 100 computers. PINs that people choose themselves (dates, 123456, patterns) fall much sooner. The limit of 5 attempts applies only inside the extension, not to a copy of the profile."
explain_off = "If you turn off Allow PIN after restart, a PIN is kept in memory only and is gone at restart; PINs that are already on disk are deleted at the next contact. If you turn off Allow PIN, every PIN is deleted at the next contact."
