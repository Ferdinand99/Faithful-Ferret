# Faithful Ferret's own interface strings (English, the source). Core strings
# (sign-in, setup, users, Security, General, the layout) come from vole-kit; a
# key may live in only one of the two.

[login]
subtitle = "Welcome back. Log in to manage your Faithful Ferret server."

[setup]
site_name_placeholder = "Home vault…"
tz_after = ". You can change this in Settings."

[users]
roles_help = "Viewers can look but not change anything. Editors can change settings. Admins can do everything, including managing users."

[tokens]
sub = "API tokens are not used by Faithful Ferret yet."
scope_read_sub = "Nothing yet"

[auth]
all_set = "You’re all set. Your vault is on its own address, separate from this admin page."
setup_token_required = "This instance needs a setup token. Open /setup?token=… with the value of FERRET_SETUP_TOKEN from the server’s configuration."

[error]
back = "Back to settings"

[general]
sub = "How this instance names itself, where it is reached and how it tells time."
base_url_help = "Where people reach the admin pages: used in links in messages. The web vault has its own address (FERRET_VAULT_URL)."

[api]
docs_subtitle = "Faithful Ferret has no public API reference yet."

[mailnote]
title = "Email"
label = "Email from Faithful Ferret"
none = "Not sent"
help = "Faithful Ferret sends no email in this version. Leave the mail settings above empty: if they are filled in, the Users page can also email a sign-in code, which then sits in a mailbox for up to 24 hours. Hand a code over yourself (the Users page for another person, or the command ferret sign-in-code issue)."
error = "This setting has one value."

[backup]
title = "Backup"
sub = "What the backup of this server did last. A backup holds the database and the server’s secret files; this page shows only times, counts and codes."
failed_title = "The last backup failed"
state = "State"
state_unknown = "Not run yet"
state_running = "Running"
state_ok = "Good"
state_failed = "Failed"
sets = "Sets kept"
status = "Status"
last_good = "Last good backup"
never = "Never"
last_failure = "Last failure"
none = "None"
last_push = "Last message to the monitor"
none_yet = "None sent yet"
push_ok = "Taken"
push_failed = "Not taken"
next_run = "Next backup"
unknown = "Not known yet"
why_no_space = "There was too little free space for a backup. Older sets were left as they are."
why_io = "A file or folder of the backup could not be read, written or moved."
why_verify = "The new set did not pass its check, so it was not kept as a good set."
why_refused = "The backup was refused before anything changed."
why_restore = "A restore is in progress, so no backup is made."
why_unknown = "The backup failed for a reason this page does not know."
push_address = "The monitor’s address is not usable."
push_timeout = "The monitor did not answer in time."
push_connect = "The monitor could not be reached."
push_status = "The monitor answered with something other than success."
push_request = "The message could not be sent."
push_unknown = "The message failed for a reason this page does not know."
now_title = "Take a backup now"
now_sub = "Asks for a backup right away. It starts within a minute, and the state above shows it while it runs."
now = "Take a backup now"
busy = "A backup is running or about to start."
requested = "A backup was asked for. It starts within a minute."
already = "A backup is already running or about to start."
foot = "Old sets are removed after the time set in the server’s configuration, but the three newest good sets always stay. This server writes its sets only to its own backup folder; a copy outside this machine needs a separate job."
