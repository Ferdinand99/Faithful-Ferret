[package]
name = "ferret-server-auth"
description = "Server half of the OPAQUE login of Faithful Ferret, a self-hosted zero-knowledge password manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Test clocks and the helpers the integration tests share. Never part of a
# release build: see scripts/check-no-test-support.sh.
test-support = ["ferret-core/test-support", "dep:serde_json"]

[dependencies]
# The one OPAQUE suite, its context string and the message lengths come from
# the core. This crate has no OPAQUE or Argon2 dependency of its own: the key
# stretching function belongs to the client.
ferret-core = { path = "../ferret-core", features = ["server-suite"] }
# Same pins and features as ferret-core, so the lock gains no new version.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# Only for the runner of the server vectors behind `test-support`.
serde_json = { version = "=1.0.154", optional = true }
subtle = "=2.6.1"
unicode-normalization = { version = "=0.1.24", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
# The tests need the replay RNGs of the core and this crate's own test clock.
ferret-core = { path = "../ferret-core", features = ["test-support", "server-suite"] }
ferret-server-auth = { path = ".", features = ["test-support"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
serde_json = "=1.0.154"
