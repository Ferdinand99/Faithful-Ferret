[package]
name = "ferret-core"
description = "Crypto core of Faithful Ferret, a self-hosted zero-knowledge password manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Replay and test RNGs, the vector loader and runner. Never part of a release
# build: see scripts/check-no-test-support.sh.
test-support = ["dep:serde", "dep:serde_json"]

[dependencies]
getrandom = "=0.4.3"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc", "derive"] }
# Primitives (Fase 1 section 3). Exact pins; `zeroize` clears key schedules
# and Argon2 state where the crate offers it.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# Only for TOTP (RFC 6238 allows HMAC-SHA-1); everything else uses SHA-2.
sha1 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
# Text handling (Fase 1 section 3.1): NFKD with the Unicode 16.0 tables and the
# "assigned" check. 0.1.24 is Unicode 16.0 (0.1.25 is 17.0); the tests lock it.
unicode-normalization = { version = "=0.1.24", default-features = false }
unicode-general-category = "=1.1.0"
# CBOR (Fase 1 section 5.2): only the low-level `Decoder`/`Encoder`; the strict
# rules live in `cbor::decode`. No `derive`, no `half` (f16 is rejected).
minicbor = { version = "=2.3.1", default-features = false, features = ["alloc"] }
# OPAQUE (Fase 1 section 4.2, RFC 9807). opaque-ke 4.0.1 sits on the previous
# RustCrypto generation (digest 0.10, rand 0.8, curve25519-dalek 4), so it
# brings a second set of those crates; every duplicate is listed in deny.toml
# with its reason. `argon2` is NOT enabled here: the key stretching function is
# our own wrapper over argon2 0.6 (`opaque::ksf`). `sha2_010` is the SHA-512 of
# opaque-ke's 3DH suite and is used for nothing else.
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255"] }
sha2_010 = { package = "sha2", version = "=0.10.9", default-features = false }
# Passkeys (Fase 1 section 9): ECDSA P-256 (ES256) with PKCS#8 and SPKI, and
# IDNA (UTS 46) for the A-labels of origins and RP IDs. The Public Suffix List
# is an embedded snapshot, matched in `passkey::psl`.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "sha256", "alloc"] }
idna = { version = "=1.1.0", default-features = false, features = ["std", "compiled_data"] }
# Only behind `test-support`:
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "=1.0.154", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[dev-dependencies]
# The integration tests need the test-support API; ferret-vectorgen is used
# for the determinism test (a dev-dependency cycle is allowed by cargo).
ferret-core = { path = ".", features = ["test-support"] }
ferret-vectorgen = { path = "../../tools/vectorgen" }
serde = "=1.0.229"
serde_json = "=1.0.154"
static_assertions = "=1.1.0"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# Independent Argon2 implementation (previous generation) to cross-check the
# profile 1 known answers.
argon2_05 = { package = "argon2", version = "=0.5.3", default-features = false, features = ["alloc"] }
# RFC 9497 (OPRF) vectors for ristretto255-SHA512, run against the very voprf
# that opaque-ke uses (already in the tree; no new crate version).
voprf = { version = "=0.5.0", default-features = false, features = ["ristretto255-ciphersuite", "danger"] }
