[package]
name = "ferret-core"
description = "Crypto core of Faithful Ferret, a self-hosted zero-knowledge password manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Replay and test RNGs, the vector loader and runner. Never part of a release
# build: see scripts/check-no-test-support.sh.
test-support = ["dep:serde", "dep:serde_json", "dep:hmac", "dep:sha2"]

[dependencies]
getrandom = "=0.4.3"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc", "derive"] }
# Only behind `test-support`:
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
hmac = { version = "=0.13.0", optional = true }
sha2 = { version = "=0.11.1", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[dev-dependencies]
# The integration tests need the test-support API; ferret-vectorgen is used
# for the determinism test (a dev-dependency cycle is allowed by cargo).
ferret-core = { path = ".", features = ["test-support"] }
ferret-vectorgen = { path = "../../tools/vectorgen" }
serde = "=1.0.229"
serde_json = "=1.0.154"
static_assertions = "=1.1.0"
