[package]
name = "ferret-vectorgen"
description = "Generates and checks the Ferret Core test vectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ferret_vectorgen"
path = "src/lib.rs"

[[bin]]
name = "vectorgen"
path = "src/main.rs"

[dependencies]
ferret-core = { path = "../../crates/ferret-core", features = ["test-support"] }
# The server vectors are checked against the server library while they are
# made (`server_groups.rs`).
ferret-server-auth = { path = "../../crates/ferret-server-auth", features = ["test-support"] }
# hmac and sha1 only to compute the expected TOTP codes with a reference
# written apart from the core.
hmac = "=0.13.0"
serde_json = "=1.0.154"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "sha256", "alloc"] }
