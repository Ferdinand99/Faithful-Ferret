[package]
name = "ferret-vectorgen"
description = "Generates and checks the Ferret Core test vectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ferret_vectorgen"
path = "src/lib.rs"

[[bin]]
name = "vectorgen"
path = "src/main.rs"

[dependencies]
ferret-core = { path = "../../crates/ferret-core", features = ["test-support"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
