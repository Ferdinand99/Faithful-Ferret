[workspace]
resolver = "3"
members = ["crates/ferret-core", "crates/ferret-server-auth", "tools/vectorgen", "bindings/wasm"]
# The timing tests have a lock, a deny policy and a release profile of their own
# (ct/dudect/Cargo.toml): their tree (clap 2, Windows crates) does not belong in
# the lock, `cargo deny` and `cargo vet` of the release graph. The server
# (crates/ferret-server) is a workspace of its own for the same reason: it
# builds on vole-kit, a git dependency with hundreds of crates and duplicate
# versions that the release graph must not carry. Its lock, its deny policy and
# its release profile are checked against this one by
# crates/ferret-server/check-lock.sh.
exclude = ["ct/dudect", "crates/ferret-server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[profile.release]
# Small code for the WebAssembly binding; the one hot loop, Argon2id, is built
# for speed below.
opt-level = "s"
lto = true
codegen-units = 1
# A panic must never unwind through the WASM boundary, and arithmetic
# overflow must never wrap silently in release builds of the crypto core.
panic = "abort"
overflow-checks = true

[profile.release.package."argon2@0.6.0"]
opt-level = 3

# Dependencies are compiled with optimizations even in debug and test builds:
# Argon2id at 64 MiB is far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
