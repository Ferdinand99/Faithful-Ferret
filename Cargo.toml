[workspace]
resolver = "3"
members = ["crates/ferret-core", "tools/vectorgen", "bindings/wasm", "ct/dudect"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[profile.release]
# Small code for the WebAssembly binding; the one hot loop, Argon2id, is built
# for speed below.
opt-level = "s"
lto = true
codegen-units = 1
# A panic must never unwind through the WASM boundary, and arithmetic
# overflow must never wrap silently in release builds of the crypto core.
panic = "abort"
overflow-checks = true

[profile.release.package."argon2@0.6.0"]
opt-level = 3

# Dependencies are compiled with optimizations even in debug and test builds:
# Argon2id at 64 MiB is far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
