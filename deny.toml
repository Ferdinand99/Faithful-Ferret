# cargo-deny policy. See the dependency policy: exact pins for anything that
# touches cryptography, secrets or Unicode; crates.io only; no duplicate
# versions without a documented reason.

[graph]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  # minicbor (CBOR for item bodies): permissive (Blue Oak Model License).
  "BlueOak-1.0.0",
]

[bans]
multiple-versions = "deny"
# Dev-dependencies count too, so the list below is the complete set of
# approved duplicate versions.
multiple-versions-include-dev = true
# Duplicate versions are listed here, each with a reason. Later tasks add the
# ones they introduce (for example the OPAQUE dependencies that need digest 0.10).
skip = [
  # --- Test-only duplicates -------------------------------------------------
  { crate = "argon2@0.5.3", reason = "the independent cross-check implementation of Argon2id used only by tests (`argon2_05`), also the crate behind opaque-ke's own `Argon2` KSF that a test compares ours with; kept next to argon2 0.6 on purpose" },
  { crate = "blake2@0.10", reason = "dev-only: pulled in by argon2 0.5.3 (previous digest generation)" },
  # --- OPAQUE (Task 8) ------------------------------------------------------
  # opaque-ke 4.0.1 is the latest stable release (4.1.0 is only a pre-release)
  # and is built on the previous RustCrypto generation. Our own code uses the
  # new one (digest 0.11, sha2 0.11, hmac 0.13, hkdf 0.13, curve25519-dalek 5
  # through ed25519-dalek 3). The old crates below are pulled in by opaque-ke,
  # its dependency voprf, and the SHA-512 (`sha2_010`) that opaque-ke's 3DH
  # suite needs. They are in the release graph; none is used by our own code
  # except through opaque-ke's API. Remove each entry when opaque-ke moves.
  { crate = "sha2@0.10", reason = "opaque-ke: the hash of its 3DH suite (`TripleDh<_, sha2::Sha512>`) is a digest 0.10 type; also used by voprf" },
  { crate = "digest@0.10", reason = "opaque-ke, voprf, hmac 0.12, hkdf 0.12, sha2 0.10 and argon2 0.5.3 (tests) are all on digest 0.10" },
  { crate = "hmac@0.12", reason = "opaque-ke: HMAC-SHA-512 of the 3DH suite (digest 0.10)" },
  { crate = "hkdf@0.12", reason = "opaque-ke: HKDF-SHA-512 of the 3DH suite (digest 0.10)" },
  { crate = "crypto-common@0.1", reason = "digest 0.10 (opaque-ke, voprf, sha2 0.10, hmac 0.12)" },
  { crate = "block-buffer@0.10", reason = "digest 0.10 (opaque-ke, voprf, sha2 0.10, hmac 0.12)" },
  { crate = "cpufeatures@0.2", reason = "sha2 0.10 and curve25519-dalek 4 (opaque-ke); the new generation uses cpufeatures 0.3" },
  { crate = "rand_core@0.6", reason = "opaque-ke and voprf take a rand 0.6 `RngCore + CryptoRng`; our `SecureRng` adapter implements it (`opaque::client::Rng06`); also password-hash 0.5 in argon2 0.5.3 (tests)" },
  { crate = "rand@0.8", reason = "opaque-ke depends on rand 0.8 for its traits and the server-side API; the OS generator of rand 0.8 is never used (default features are off), randomness comes from `SecureRng`" },
  { crate = "curve25519-dalek@4", reason = "opaque-ke and voprf (ristretto255); ed25519-dalek 3 uses curve25519-dalek 5" },
  { crate = "elliptic-curve@0.13", reason = "opaque-ke and voprf require it unconditionally (hash-to-curve helpers); the P-256 test dependency uses elliptic-curve 0.14" },
  { crate = "ff@0.13", reason = "elliptic-curve 0.13 (opaque-ke)" },
  { crate = "group@0.13", reason = "elliptic-curve 0.13 (opaque-ke)" },
  { crate = "crypto-bigint@0.5", reason = "elliptic-curve 0.13 (opaque-ke)" },
  { crate = "sec1@0.7", reason = "elliptic-curve 0.13 (opaque-ke)" },
  { crate = "der@0.7", reason = "sec1 0.7 and elliptic-curve 0.13 (opaque-ke)" },
  { crate = "base16ct@0.2", reason = "elliptic-curve 0.13 and sec1 0.7 (opaque-ke)" },
  { crate = "const-oid@0.9", reason = "der 0.7 (opaque-ke)" },
  # --- Build-time ----------------------------------------------------------
  { crate = "syn@2", reason = "build-time proc-macro dependency only: wasm-bindgen-macro-support (getrandom wasm_js backend, wasm32 target) still uses syn 2, the serde and zeroize derives use syn 3" },
]
deny = [
  { crate = "openssl", reason = "no OpenSSL in the core" },
  { crate = "openssl-sys", reason = "no OpenSSL in the core" },
  { crate = "native-tls", reason = "no OpenSSL in the core" },
  { crate = "ring", reason = "one set of primitives: RustCrypto" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
