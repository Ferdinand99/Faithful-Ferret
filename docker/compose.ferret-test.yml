# The Faithful Ferret test stack on a private test host, behind a reverse proxy
# with a tunnel client (which does TLS and single sign-on and forwards to these two
# ports):
#
#   FERRET_ADMIN_URL  ->  http://<test host>:3040   admin pages and API
#   FERRET_VAULT_URL  ->  http://<test host>:3041   web vault
#
# The public addresses are not in this file: set FERRET_VAULT_URL and
# FERRET_ADMIN_URL (for example https://vault.example.test and
# https://admin.example.test) in docker/.env or in the environment of the shell.
#
# Use scripts/lanbox-ferret-test.sh; it makes docker/.env (not in git) with the
# setup token, the proxy address and these two URLs, and runs everything through
# the Docker context that FERRET_DOCKER_ARGS names (default `--context lanbox`).
# The data is throwaway test data.
#
# The tunnel client runs outside Docker on a host of its own: set
# FERRET_TRUSTED_PROXIES to its address in docker/.env. The script accepts one
# valid IPv4 address there, or the address of a Docker container named Newt. That
# host needs a static IP (a fixed address or a DHCP reservation): the server
# trusts exactly this address.
name: ferret-test

services:
  ferret-test-app:
    image: ferret-test-app:latest
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
      args:
        # The release's features (PIN and passkey unlock; the passkey import), no test features.
        FEATURES: passkey-import,quick-unlock
      labels:
        owner: ferret-test
    container_name: ferret-test-app
    # Not started by Docker after a reboot of the test host: `scripts/lanbox-ferret-test.sh up`
    # starts it, and its check of the trusted proxy address runs first.
    restart: "no"
    mem_limit: 512m
    # Every event stream is an open connection, and the server holds up to 1 024 of them. A container
    # starts with a soft limit of 1 024 open files on many engines, which the streams alone would use
    # up next to the database and the listeners; 4096 leaves room for both (as on the home stack).
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    labels:
      owner: ferret-test
    # The entrypoint starts as root only to give /data to uid 1000 (chown) and
    # then drops to that user (su-exec): nothing else is kept.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # TEST STACK ONLY: host networking. With published ports on a bridge
    # network, Docker's port proxy makes every connection arrive from the
    # bridge gateway, so the tunnel client of the proxy (Newt, on its own
    # network newt-net) and every other client on the host would look the same, and the
    # server refuses to trust a gateway address. On the host network the server
    # sees the real source address: the tunnel client's own address for the
    # Pangolin traffic (FERRET_TRUSTED_PROXIES) and the client's for
    # everything else. The server listens on 3040 (admin) and 3041 (vault) and
    # on nothing else.
    #
    # Residual risk, accepted for throwaway test data and not to be copied to a
    # stack with real data:
    #  * The trusted address is the fixed address of the tunnel client, which
    #    must keep it across reboots and recreates (a static address or a
    #    reservation). scripts/lanbox-ferret-test.sh up refuses to start when
    #    the address differs from the tunnel client's, but nothing checks it
    #    while the container runs. Anything else that is given the trusted
    #    address would be believed.
    #  * A host that can send ARP on the bridges of the test host can pose as that
    #    address.
    #  * Everything Newt forwards counts as the proxy, including a Pangolin raw
    #    TCP resource or client access aimed at these ports, which skips the
    #    sign-in of the proxy and can send any X-Forwarded-* header.
    #  * The host network lets the process reach loopback-only services of the
    #    test host.
    network_mode: host
    volumes:
      - ferret-test-data:/data
    environment:
      FERRET_DATA_DIR: /data
      FERRET_VAULT_URL: ${FERRET_VAULT_URL:?set FERRET_VAULT_URL in docker/.env}
      FERRET_ADMIN_URL: ${FERRET_ADMIN_URL:?set FERRET_ADMIN_URL in docker/.env}
      # The address the Pangolin tunnel traffic reaches the server from: the
      # address of the Newt container on newt-net. Never a bridge
      # gateway (the server refuses it). Set in docker/.env.
      FERRET_TRUSTED_PROXIES: ${FERRET_TRUSTED_PROXIES:?set FERRET_TRUSTED_PROXIES in docker/.env}
      # The kit honours X-Forwarded-Proto for its own cookies. Safe: the server
      # removes the forwarding headers of every peer that is not listed above.
      FERRET_TRUST_PROXY: "1"
      FERRET_SETUP_TOKEN: ${FERRET_SETUP_TOKEN:?set FERRET_SETUP_TOKEN in docker/.env}
      # One log line per new peer address (scripts/lanbox-ferret-test.sh peers).
      FERRET_LOG_PEERS: "1"

volumes:
  ferret-test-data:
    name: ferret-test-data
    labels:
      owner: ferret-test
