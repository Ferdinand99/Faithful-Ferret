# The Faithful Ferret stack for real data, on a host that already runs a reverse proxy client
# (a service on the host, not a container): the proxy is on the host
# and reaches the server on the host's loopback address.
#
#   https://vault.example.org  ->  proxy  ->  http://127.0.0.1:3041   web vault and API
#   https://admin.example.org  ->  proxy  ->  http://127.0.0.1:3040   admin pages
#
# Start it with scripts/ferret-home.sh (up), never with `docker compose up` by hand: the
# script checks that the image is a release image, that it is the image of the release
# tag, and that this file is as it was released. Nothing starts without an explicit yes.
#
# What is different from the test stack (docker/compose.ferret-test.yml):
#
#  * No host network and no own tunnel client. The server is published on the loopback
#    address of the host, on two ports, and nowhere else (never 0.0.0.0, never an
#    address of the LAN or the internet).
#  * The stack has a network of its own with a fixed subnet and a fixed gateway. A
#    connection from the host to a published loopback port reaches the container from
#    the gateway of that network, so FERRET_TRUSTED_PROXIES is exactly the gateway:
#    what the proxy on the host forwards (X-Forwarded-*) is believed, and nothing else
#    is. The server refuses a gateway that ends in .1 inside the Docker address pools
#    (it would be the address of every direct client of a published port), so the
#    gateway is a different address of the subnet. Change subnet and gateway together.
#  * The copy container is on a network of its own (ferret-home-copy-net, another fixed
#    subnet), never on the app's network. It needs a way out to the SFTP target and its
#    monitor and nothing else, so it cannot open the app's ports 3040 and 3041 directly
#    (Docker keeps two of its networks apart), and the published ports are on the
#    host's loopback address, which a container does not reach. The copy container
#    holds an SSH key and is the one part of the stack that talks to another machine.
#  * The data and the backup sets are on two volumes of their own (label
#    owner=ferret-home). The copy container reads the sets read-only.
#  * The image is a release image, taken by digest (FERRET_IMAGE, set by the script).
#  * The settings of the server (its two public addresses, the setup token, the push
#    address of its monitor) are in home.env, those of the copy container (the target,
#    the public key, the push address of its monitor) in copy.env, so each container
#    gets only its own. Neither is in git; docker/home.env.example and
#    docker/copy.env.example list the names, with no values. Only compose reads these
#    files; no script does. The SSH key of the copy container is a file of its own
#    (docker/secrets/copy_sftp_key, not in git).
#
# Residual risk, accepted: any process on the host that can open a connection to the
# loopback ports counts as the proxy. They are the host's own processes.
#
# Rules that keep trusting the gateway safe. The server believes X-Forwarded-* only from the
# gateway, and only processes of this host can reach the loopback ports. Whatever lets a remote
# client connect to these ports through the proxy client's own network path, instead of through
# the proxy's web layer, makes every such client "the proxy":
#  * Never add a raw TCP/UDP resource for the ports 3040 or 3041 on the site of this host, and
#    never give client access or a private resource on that site that reaches this host or its
#    loopback address. A forged X-Forwarded-For or X-Forwarded-Proto would then be believed
#    (the throttles and the https check are defeated, and a sign-in in front of the admin pages
#    is bypassed). The site may be shared with other apps: look at what is on it first.
#  * The private resource from this host toward the backup target is limited to the SFTP host and
#    port. Containers on this host reach it through the host's routes, the app container too.
#  * A raw-TCP fallback toward the target must never expose the target's main sshd: use a
#    dedicated SFTP-only sshd (AllowUsers the copy user, no passwords, a chroot folder,
#    ForceCommand internal-sftp, no forwarding) on a port of its own.
#  * Read the host key of the target on the target itself, never with ssh-keyscan through the
#    tunnel (that is trust on first use).
#  * After the first start, send one request with a forged X-Forwarded-For through the public
#    address of the vault and look at what the server recorded: the client address must be the
#    real one, not the forged one, so the proxy does not pass the client's value on as the
#    entry the server believes. The server records peer addresses only while the peer log is
#    on (FERRET_HOME_LOG_PEERS=1 for `up`, see FERRET_LOG_PEERS below); turn it off again
#    after the check.
#
# What the host that runs `scripts/ferret-home.sh up` needs: Docker 28 or newer (`up` checks),
# docker buildx, compose v2, git with the release tags, node, and cosign (or --no-cosign, which
# is recorded). The release image package must be public in the registry, or the host must be
# logged in to it. The subnet below must be free. A nightly snapshot of the copy folder on the
# target needs a file system that has snapshots (ZFS, btrfs); an XFS array cannot. A job on
# the target that COPIES (not moves) the files into a folder the copy user cannot write also
# works; moving them would make the copy container upload everything again.
name: ferret-home

services:
  ferret-home-app:
    image: ${FERRET_IMAGE:?start the stack with scripts/ferret-home.sh up}
    container_name: ferret-home-app
    # Safe because the restore marker stops the server from starting in the middle of a restore.
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    labels:
      owner: ferret-home
    # The entrypoint starts as root only to give /data and /backups to uid 1000 (chown)
    # and then drops to that user (su-exec): nothing else is kept.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    ports:
      - "127.0.0.1:3040:3040"
      - "127.0.0.1:3041:3041"
    networks:
      ferret-home-net:
        ipv4_address: 172.30.251.2
    volumes:
      - ferret-home-data:/data
      - ferret-home-backups:/backups
    env_file:
      - path: ${FERRET_HOME_ENV:-home.env}
        required: true
    environment:
      FERRET_DATA_DIR: /data
      FERRET_BACKUP_DIR: /backups
      # The gateway of the network ferret-home-net, and nothing else.
      FERRET_TRUSTED_PROXIES: 172.30.251.14
      FERRET_TRUST_PROXY: "1"
      # Off by default: IP addresses are not kept longer than needed. When on, the server
      # writes one log line per new peer address, and `scripts/ferret-home.sh status` shows
      # which addresses it has seen and whether it believed them. Switch it on only for the
      # forged X-Forwarded-For check after the first start, or to debug the proxy:
      #   FERRET_HOME_LOG_PEERS=1 scripts/ferret-home.sh up <tag> --yes-ferret-home
      # and afterwards run `up` again without it, so the app runs with the log off.
      FERRET_LOG_PEERS: ${FERRET_HOME_LOG_PEERS:-0}

  ferret-home-copy:
    image: ferret-home-copy:latest
    pull_policy: build
    build:
      context: .
      dockerfile: backup-copy.Dockerfile
      target: copy
      labels:
        owner: ferret-home
    container_name: ferret-home-copy
    restart: unless-stopped
    init: true
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    labels:
      owner: ferret-home
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # The copy is packed and encrypted here before it is sent; it is gone at the end of the cycle.
      - /work:size=768m,uid=1000,gid=1000,mode=0700
      - /tmp:size=16m
    # Its own network: never the app's (see the top of this file).
    networks:
      ferret-home-copy-net:
        ipv4_address: 172.30.251.18
    volumes:
      # The sets, read-only. Nothing else of the server is mounted: not the data, not the keys.
      - ferret-home-backups:/backups:ro
    secrets:
      - copy_sftp_key
    env_file:
      - path: ${FERRET_COPY_ENV:-copy.env}
        required: true
    environment:
      FERRET_COPY_BACKUPS_DIR: /backups
      FERRET_COPY_SFTP_KEY_FILE: /run/secrets/copy_sftp_key

secrets:
  copy_sftp_key:
    file: ./secrets/copy_sftp_key

volumes:
  ferret-home-data:
    name: ferret-home-data
    labels:
      owner: ferret-home
  ferret-home-backups:
    name: ferret-home-backups
    labels:
      owner: ferret-home

networks:
  ferret-home-net:
    name: ferret-home-net
    labels:
      owner: ferret-home
    ipam:
      config:
        - subnet: 172.30.251.0/28
          gateway: 172.30.251.14
  # The copy container's way out (to the SFTP target and the monitor). Not internal: it must
  # reach another machine. Nothing else is on it.
  ferret-home-copy-net:
    name: ferret-home-copy-net
    labels:
      owner: ferret-home
    ipam:
      config:
        - subnet: 172.30.251.16/28
          gateway: 172.30.251.17
