# The Faithful Ferret stack for real data, on a host that already runs a reverse proxy client
# (a service on the host, not a container): the proxy is on the host
# and reaches the server on the host's loopback address.
#
#   https://vault.example.org  ->  proxy  ->  http://127.0.0.1:3041   web vault and API
#   https://admin.example.org  ->  proxy  ->  http://127.0.0.1:3040   admin pages
#
# Start it with scripts/ferret-home.sh (up), never with `docker compose up` by hand: the
# script checks that the image is a release image, that it is the image of the release
# tag, and that this file is as it was released. Nothing starts without an explicit yes.
#
# What is different from the test stack (docker/compose.ferret-test.yml):
#
#  * No host network and no own tunnel client. The server is published on the loopback
#    address of the host, on two ports, and nowhere else (never 0.0.0.0, never an
#    address of the LAN or the internet).
#  * The stack has a network of its own with a fixed subnet and a fixed gateway. A
#    connection from the host to a published loopback port reaches the container from
#    the gateway of that network, so FERRET_TRUSTED_PROXIES is exactly the gateway:
#    what the proxy on the host forwards (X-Forwarded-*) is believed, and nothing else
#    is. The server refuses a gateway that ends in .1 inside the Docker address pools
#    (it would be the address of every direct client of a published port), so the
#    gateway is a different address of the subnet. Change subnet and gateway together.
#  * The data and the backup sets are on two volumes of their own (label
#    owner=ferret-home). The copy container reads the sets read-only.
#  * The image is a release image, taken by digest (FERRET_IMAGE, set by the script).
#  * The settings of the server (its two public addresses, the setup token, the push
#    address of its monitor) are in home.env, those of the copy container (the target,
#    the public key, the push address of its monitor) in copy.env, so each container
#    gets only its own. Neither is in git; docker/home.env.example and
#    docker/copy.env.example list the names, with no values. Only compose reads these
#    files; no script does. The SSH key of the copy container is a file of its own
#    (docker/secrets/copy_sftp_key, not in git).
#
# Residual risk, accepted: any process on the host that can open a connection to the
# loopback ports counts as the proxy. They are the host's own processes.
name: ferret-home

services:
  ferret-home-app:
    image: ${FERRET_IMAGE:?start the stack with scripts/ferret-home.sh up}
    container_name: ferret-home-app
    # Safe because the restore marker stops the server from starting in the middle of a restore.
    restart: unless-stopped
    mem_limit: 512m
    labels:
      owner: ferret-home
    # The entrypoint starts as root only to give /data and /backups to uid 1000 (chown)
    # and then drops to that user (su-exec): nothing else is kept.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    ports:
      - "127.0.0.1:3040:3040"
      - "127.0.0.1:3041:3041"
    networks:
      ferret-home-net:
        ipv4_address: 172.30.251.2
    volumes:
      - ferret-home-data:/data
      - ferret-home-backups:/backups
    env_file:
      - path: ${FERRET_HOME_ENV:-home.env}
        required: true
    environment:
      FERRET_DATA_DIR: /data
      FERRET_BACKUP_DIR: /backups
      # The gateway of the network ferret-home-net, and nothing else.
      FERRET_TRUSTED_PROXIES: 172.30.251.14
      FERRET_TRUST_PROXY: "1"
      # One log line per new peer address: `scripts/ferret-home.sh status` shows which
      # addresses the server has seen, and whether it believed them.
      FERRET_LOG_PEERS: "1"

  ferret-home-copy:
    image: ferret-home-copy:latest
    build:
      context: .
      dockerfile: backup-copy.Dockerfile
      target: copy
      labels:
        owner: ferret-home
    container_name: ferret-home-copy
    restart: unless-stopped
    init: true
    mem_limit: 1g
    labels:
      owner: ferret-home
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # The copy is packed and encrypted here before it is sent; it is gone at the end of the cycle.
      - /work:size=768m,uid=1000,gid=1000,mode=0700
      - /tmp:size=16m
    networks:
      ferret-home-net:
        ipv4_address: 172.30.251.3
    volumes:
      # The sets, read-only. Nothing else of the server is mounted: not the data, not the keys.
      - ferret-home-backups:/backups:ro
    secrets:
      - copy_sftp_key
    env_file:
      - path: ${FERRET_COPY_ENV:-copy.env}
        required: true
    environment:
      FERRET_COPY_BACKUPS_DIR: /backups
      FERRET_COPY_SFTP_KEY_FILE: /run/secrets/copy_sftp_key

secrets:
  copy_sftp_key:
    file: ./secrets/copy_sftp_key

volumes:
  ferret-home-data:
    name: ferret-home-data
    labels:
      owner: ferret-home
  ferret-home-backups:
    name: ferret-home-backups
    labels:
      owner: ferret-home

networks:
  ferret-home-net:
    name: ferret-home-net
    labels:
      owner: ferret-home
    ipam:
      config:
        - subnet: 172.30.251.0/28
          gateway: 172.30.251.14
