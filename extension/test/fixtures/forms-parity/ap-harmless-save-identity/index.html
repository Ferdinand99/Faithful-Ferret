<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save identity</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Save a identity item</h1>
<pre id="sample">{ "fields": [ { "autocomplete": "given-name", "value": "Sample" }, { "autocomplete": "family-name", "value": "Person" }, { "autocomplete": "tel", "value": "5550100" } ] }</pre>
<save-item id="save" data-kind="identity"></save-item>
<p class="small">The button needs the add-on that handles saved items.</p>
<script>
class SaveItem extends HTMLElement {
  connectedCallback() {
    var b = document.createElement("button"); b.type = "button"; b.textContent = "Save item";
    this.appendChild(b);
  }
}
customElements.define("save-item", SaveItem);
</script>
</body>
</html>
