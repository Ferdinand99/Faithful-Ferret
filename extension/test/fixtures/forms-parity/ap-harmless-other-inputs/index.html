<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Settings</h1>
<form id="f" method="post" action="/static/login-done.html">
<label for="notes">Notes</label>
<textarea id="notes" name="notes" rows="3" placeholder="Several lines"></textarea>
<fieldset><legend>Options</legend>
<label><input id="c1" type="checkbox" name="c1" value="1"> One</label>
<label><input id="c2" type="checkbox" name="c2" value="2"> Two</label>
</fieldset>
<fieldset><legend>Choice</legend>
<label><input id="r1" type="radio" name="r" value="1"> One</label>
<label><input id="r2" type="radio" name="r" value="2"> Two</label>
</fieldset>
<label for="file">File</label><input id="file" name="file" type="file">
<label for="color">Colour</label><input id="color" name="color" type="color">
<label for="range">Range</label><input id="range" name="range" type="range" min="0" max="100">
<label for="date">Date</label><input id="date" name="date" type="date">
<label for="time">Time</label><input id="time" name="time" type="time">
<label for="num">Number</label><input id="num" name="num" type="number">
<label for="link">Address</label><input id="link" name="link" type="url">
<label for="pick">Pick</label><select id="pick" name="pick"><option>A</option><option>B</option></select>
<div class="row"><button id="go" type="submit">Save</button></div>
</form>
</body>
</html>
