<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact details</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Contact details</h1>
<form id="f" method="post" action="/static/login-done.html">
<label for="given">First name</label>
<input id="given" name="given-name" type="text" autocomplete="given-name">
<label for="family">Last name</label>
<input id="family" name="family-name" type="text" autocomplete="family-name">
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email">
<label for="tel">Phone</label>
<input id="tel" name="tel" type="tel" autocomplete="tel">
<label for="bday">Birthday</label>
<input id="bday" name="bday" type="date" autocomplete="bday">
<label for="street">Street address</label>
<input id="street" name="address-line1" type="text" autocomplete="address-line1">
<label for="zip">Postal code</label>
<input id="zip" name="postal-code" type="text" autocomplete="postal-code">
<div class="row"><button id="go" type="submit">Save</button></div>
</form>
</body>
</html>
