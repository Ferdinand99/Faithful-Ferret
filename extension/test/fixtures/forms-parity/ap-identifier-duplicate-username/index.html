<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Sign in</h1>
<form id="step-one">
<label for="u">Email address</label>
<input id="u" name="email" type="email" autocomplete="username">
<div class="row"><button id="next" type="submit">Next</button></div>
</form>
<form id="step-two" method="post" action="/static/login-done.html" style="display: none">
<input id="u2" name="j_username" type="text" autocomplete="username" hidden>
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<div class="row"><button id="go" type="submit">Sign in</button></div>
</form>
<script>
document.getElementById("step-one").addEventListener("submit", function (e) {
  e.preventDefault();
  document.getElementById("u2").value = document.getElementById("u").value;
  document.getElementById("step-one").style.display = "none";
  document.getElementById("step-two").style.display = "block";
  document.getElementById("p").focus();
});
</script>
</body>
</html>
