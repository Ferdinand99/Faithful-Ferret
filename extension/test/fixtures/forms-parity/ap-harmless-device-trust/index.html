<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device checks</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Device checks</h1>
<label for="mode">View</label>
<select id="mode"><option>Failing checks</option><option>Snoozes</option></select>
<p><button id="add-block" type="button">Add blocker</button></p>
<p><button id="clear-block" type="button">Remove blockers</button></p>
<p><button id="add-warn" type="button">Add warning</button></p>
<p><button id="clear-warn" type="button">Remove warnings</button></p>
<p><button id="recheck" type="button">Recheck device</button></p>
<ul id="rows"><li>No items found</li></ul>
<script>
document.getElementById("add-block").addEventListener("click", function () {
  var li = document.createElement("li"); li.textContent = "Blocker"; document.getElementById("rows").appendChild(li);
});
</script>
</body>
</html>
