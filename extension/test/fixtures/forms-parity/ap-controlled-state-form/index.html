<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// A controlled form: the state is the source of truth and the field values are written back from it after every change.
(function () {
  var state = { user: "", pass: "", busy: false };
  var app = document.getElementById("app");
  app.innerHTML = '<h1>Sign in</h1><form id="login" novalidate>' +
    '<label for="u">Email</label><input id="u" name="user" type="text" autocomplete="username">' +
    '<label for="p">Password</label><input id="p" name="pass" type="password" autocomplete="current-password">' +
    '<button id="go" type="submit">Sign in</button></form>';
  var u = document.getElementById("u");
  var p = document.getElementById("p");
  var go = document.getElementById("go");
  function render() {
    if (u.value !== state.user) u.value = state.user;
    if (p.value !== state.pass) p.value = state.pass;
    go.disabled = !(state.user && state.pass) || state.busy;
  }
  u.addEventListener("input", function (e) { state.user = e.target.value.trim(); render(); });
  p.addEventListener("input", function (e) { state.pass = e.target.value; render(); });
  document.getElementById("login").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!(state.user && state.pass)) return;
    state.busy = true;
    render();
    // The sign-in succeeds a moment later and the page shows the signed-in view instead of the form.
    setTimeout(function () { app.innerHTML = "<h1>Welcome</h1><p>You are signed in.</p>"; }, 400);
  });
  render();
})();
</script>
</body>
</html>
