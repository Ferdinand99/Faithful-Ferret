<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Sign in</h1>
<section id="login-root"></section>
<aside id="ticker" class="small"></aside>
<script>
setTimeout(function () {
  document.getElementById("login-root").innerHTML = "<form id=\"login\" method=\"post\" action=\"/static/login-done.html\">\n<label for=\"u\">User name</label>\n<input id=\"u\" name=\"username\" type=\"text\" autocomplete=\"username\">\n<label for=\"p\">Password</label>\n<input id=\"p\" name=\"password\" type=\"password\" autocomplete=\"current-password\">\n<div class=\"row\"><button id=\"go\" type=\"submit\">Sign in</button></div>\n</form>";
}, 100);
var n = 0;
setInterval(function () {
  var t = document.getElementById("ticker");
  var frag = document.createDocumentFragment();
  for (var i = 0; i < 40; i += 1) { var s = document.createElement("span"); s.textContent = (n + i) + " "; frag.appendChild(s); }
  t.replaceChildren(frag);
  n += 1;
}, 25);
</script>
</body>
</html>
