<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Account</h1>
<button id="open" type="button">Sign in</button>
<dialog id="dlg" aria-labelledby="t" style="position: fixed; top: 140px; left: 40px; margin: 0">
<h2 id="t">Sign in</h2>
<form id="login" method="post" action="/static/login-done.html">
<label for="u">User name</label>
<input id="u" name="username" type="text" autocomplete="username">
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<div class="row"><button id="go" type="submit">Sign in</button></div>
</form>
</dialog>
<script>
document.getElementById("open").addEventListener("click", function () { document.getElementById("dlg").show(); });
</script>
</body>
</html>
