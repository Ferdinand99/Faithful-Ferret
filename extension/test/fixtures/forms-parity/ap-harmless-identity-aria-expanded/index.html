<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact details</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Contact details</h1>
<form id="f" method="post" action="/static/login-done.html">
<label for="name">Full name</label>
<input id="name" name="name" type="text" autocomplete="name">
<label for="street">Street address</label>
<input id="street" name="address-line1" type="text" autocomplete="address-line1" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="streets" aria-expanded="false">
<ul id="streets" role="listbox" hidden><li role="option">Harbour Road 1</li><li role="option">Harbour Road 2</li></ul>
<label for="city">City</label>
<input id="city" name="address-level2" type="text" autocomplete="address-level2" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="cities" aria-expanded="false">
<ul id="cities" role="listbox" hidden><li role="option">Northtown</li><li role="option">Southtown</li></ul>
<div class="row"><button id="go" type="submit">Save</button></div>
</form>
<script>
["street", "city"].forEach(function (id) {
  var input = document.getElementById(id);
  var list = document.getElementById(id === "street" ? "streets" : "cities");
  input.addEventListener("focus", function () { list.hidden = false; input.setAttribute("aria-expanded", "true"); });
  input.addEventListener("blur", function () { setTimeout(function () { list.hidden = true; input.setAttribute("aria-expanded", "false"); }, 150); });
});
</script>
</body>
</html>
