<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Details</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1 id="head">Details, step 1</h1>
<form id="multi" method="post" action="/static/login-done.html">
<div id="s1">
<label for="first">First name</label>
<input id="first" name="first" type="text">
<label for="last">Last name</label>
<input id="last" name="last" type="text">
<div class="row"><button id="next" type="button">Next</button></div>
</div>
<div id="s2" style="display: none">
<label for="email">Email address</label>
<input id="email" name="email" type="email">
<label for="phone">Phone</label>
<input id="phone" name="phone" type="tel">
<div class="row"><button id="go" type="submit">Send</button></div>
</div>
</form>
<script>
document.getElementById("next").addEventListener("click", function () {
  document.getElementById("s1").style.display = "none";
  document.getElementById("s2").style.display = "block";
  document.getElementById("head").textContent = "Details, step 2";
});
</script>
</body>
</html>
