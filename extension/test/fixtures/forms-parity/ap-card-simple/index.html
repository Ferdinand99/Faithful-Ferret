<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Payment</h1>
<form id="f" method="post" action="/static/login-done.html">
<label for="holder">Name on card</label>
<input id="holder" name="cc-name" type="text" autocomplete="cc-name">
<label for="kind">Card type</label>
<select id="kind" name="cc-type" autocomplete="cc-type"><option value="a">Type A</option><option value="b">Type B</option></select>
<label for="number">Card number</label>
<input id="number" name="cc-number" type="text" inputmode="numeric" autocomplete="cc-number">
<label for="cvc">Security code</label>
<input id="cvc" name="cc-csc" type="text" inputmode="numeric" autocomplete="cc-csc">
<label for="month">Expiry month</label>
<select id="month" name="cc-exp-month" autocomplete="cc-exp-month"><option>01</option><option>02</option><option>03</option></select>
<label for="year">Expiry year</label>
<select id="year" name="cc-exp-year" autocomplete="cc-exp-year"><option>2031</option><option>2032</option></select>
<div class="row"><button id="go" type="submit">Pay</button></div>
</form>
</body>
</html>
