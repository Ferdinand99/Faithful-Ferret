<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Choose a password</h1>
<form id="f" method="post" action="/static/login-done.html">
<label for="carried">Email address</label>
<input id="carried" name="email" type="email" autocomplete="email" readonly value="">
<label for="pw">Password</label>
<input id="pw" name="password" type="password" autocomplete="new-password">
<label for="pw2">Confirm password</label>
<input id="pw2" name="password_confirmation" type="password" autocomplete="new-password">
<div class="row"><button id="go" type="submit">Create account</button></div>
</form>
<script>
var u = new URLSearchParams(location.search).get("u") || "";
var c = document.getElementById("carried");
if (c) c.value = u;
</script>
</body>
</html>
