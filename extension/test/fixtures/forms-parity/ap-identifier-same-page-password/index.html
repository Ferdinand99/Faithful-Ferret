<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 460px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio], input[type=file], input[type=color], input[type=range] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 280px; border: 1px solid #bbb; }
dialog { width: 380px; padding: 12px 16px; }
</style>
</head>
<body>
<div class="box">
<h1 id="title">Log in</h1>
<form id="flow" novalidate>
  <div id="step-1">
    <label for="u">Email address</label>
    <input id="u" name="identifier" type="email" autocomplete="username">
    <button type="button" id="next">Continue</button>
  </div>
  <div id="step-2" hidden>
    <p>Signing in as <strong id="who"></strong></p>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password">
    <button type="submit" id="go">Log in</button>
  </div>
</form>
</div>
<script>
(function () {
  var one = document.getElementById("step-1");
  var two = document.getElementById("step-2");
  document.getElementById("next").addEventListener("click", function () {
    document.getElementById("who").textContent = document.getElementById("u").value;
    one.hidden = true;
    two.hidden = false;
    setTimeout(function () { document.getElementById("p").focus(); }, 50);
  });
  document.getElementById("flow").addEventListener("submit", function (e) {
    e.preventDefault();
    // The sign-in succeeds a moment later: the form goes and a greeting takes its place.
    setTimeout(function () {
      document.getElementById("flow").remove();
      document.getElementById("title").textContent = "Welcome back";
    }, 400);
  });
})();
</script>
</body>
</html>
