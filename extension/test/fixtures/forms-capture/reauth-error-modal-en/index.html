<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
button { width: auto; padding: 6px 14px; }
</style>
</head>
<body>
<main id="main">
<h1>Sign in</h1>
<form id="login" method="post" action="/static/login-done.html">
<label for="u">User name</label>
<input id="u" name="username" type="text" autocomplete="username">
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<button id="go" type="submit">Sign in</button>
</form>
</main>
<dialog id="err"><p>Wrong user name or password.</p><form method="dialog"><button>Close</button></form></dialog>
<script>
// A failed sign-in: an error modal opens over the form and the rest of the page is hidden from assistive technology.
document.getElementById("login").addEventListener("submit", function (e) {
  e.preventDefault();
  setTimeout(function () {
    document.getElementById("main").setAttribute("aria-hidden", "true");
    document.getElementById("err").showModal();
  }, 200);
});
</script>
</body>
</html>
