<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
button { width: auto; padding: 6px 14px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// A single-page app with hash routes: a failed sign-in changes the route and draws the form again with an error.
function view(error) {
  document.getElementById("app").innerHTML = '<h1>Sign in</h1>' + (error ? '<p role="alert">Sign-in failed. Try again.</p>' : "") +
    '<form id="login"><label for="u">User name</label><input id="u" name="username" type="text" autocomplete="username">' +
    '<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">' +
    '<button id="go" type="submit">Sign in</button></form>';
  document.getElementById("login").addEventListener("submit", function (e) {
    e.preventDefault();
    location.hash = "#/signin-failed";
    setTimeout(function () { view(true); }, 100);
  });
}
view(false);
</script>
</body>
</html>
