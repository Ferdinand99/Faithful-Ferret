<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opprett konto</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; } body { max-width: 560px; }
</style>
</head>
<body>
<h1>Opprett konto</h1>
<form id="f" method="post" action="/static/login-done.html">
<div class="cols">
<div><label for="fn">Fullt navn</label><input id="fn" name="fornavn" type="text" autocomplete="given-name"></div>
<div><label for="ln">Etternavn</label><input id="ln" name="etternavn" type="text" autocomplete="family-name"></div>
<div><label for="tel">Mobilnummer</label><input id="tel" name="mobil" type="tel" autocomplete="tel"></div>
<div><label for="epost">E-postadresse</label><input id="epost" name="epost" type="email" autocomplete="email"></div>
<div><label for="pw">Passord</label><input id="pw" name="passord" type="password" autocomplete="new-password"></div>
<div><label for="pw2">Gjenta passord</label><input id="pw2" name="passord_gjenta" type="password" autocomplete="new-password"></div>
</div>
<div class="row"><button id="go" type="submit">Opprett konto</button></div>
</form>
</body>
</html>
