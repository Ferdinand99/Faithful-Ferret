<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Anmelden</h1>
<slot-panel>
<label for="u">Benutzername</label>
<input id="u" name="username" type="text" autocomplete="username">
<label for="p">Passwort</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<div class="row"><button id="go" type="button" onclick="location.assign('/static/login-done.html')">Anmelden</button></div>
</slot-panel>
<script>
customElements.define("slot-panel", class extends HTMLElement {
  connectedCallback() { this.attachShadow({ mode: "open" }).innerHTML = "<div style='border:1px solid #bbb;padding:12px'><slot></slot></div>"; }
});
</script>
</body>
</html>
