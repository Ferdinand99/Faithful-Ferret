<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konto erstellen</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Konto erstellen</h1>
<form id="f" method="post" action="/static/login-done.html">
<label for="user">Benutzername</label>
<input id="user" name="benutzername" type="text" autocomplete="username">
<label for="mail">E-Mail-Adresse</label>
<input id="mail" name="email" type="email" autocomplete="email">
<label for="pw">Passwort</label>
<input id="pw" name="passwort" type="password" autocomplete="new-password">
<label for="pw2">Passwort bestätigen</label>
<input id="pw2" name="passwort2" type="password" autocomplete="new-password">
<div class="row"><button id="go" type="submit">Konto erstellen</button></div>
</form>
</body>
</html>
