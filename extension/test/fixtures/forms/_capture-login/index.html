<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; }
label { display: block; margin: 8px 0 2px; }
input, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
button { width: auto; }
section { margin: 0; }
</style>
</head>
<body>
<!-- Not a case of the corpus: the page of the capture script's footprint test with a sign-in form. A sign-in form and a
     page of about two thousand elements, so that what the script costs is measured where it has something to look at. -->
<h1>Sign in</h1>
<form id="login" method="post" action="/static/login-done.html" onsubmit="event.preventDefault()">
<label for="u">User name</label>
<input id="u" name="username" type="text" autocomplete="username">
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<button id="go" type="submit">Sign in</button>
</form>
<main id="app"></main>
<script>
var app = document.getElementById("app");
for (var i = 0; i < 225; i += 1) {
  var section = document.createElement("section");
  section.className = "s";
  for (var j = 0; j < 4; j += 1) {
    var p = document.createElement("p");
    var a = document.createElement("a");
    a.href = "#" + i + "-" + j;
    a.textContent = "item " + i + "." + j;
    p.appendChild(a);
    section.appendChild(p);
  }
  app.appendChild(section);
}
</script>
</body>
</html>
