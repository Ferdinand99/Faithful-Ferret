<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Inloggen</h1>
<div id="mixed">
<label for="u">Gebruikersnaam</label>
<input id="u" name="gebruikersnaam" type="text" autocomplete="username">
<pass-box></pass-box>
<div class="row"><button id="go" type="button" onclick="location.assign('/static/login-done.html')">Inloggen</button></div>
</div>
<script>
customElements.define("pass-box", class extends HTMLElement {
  connectedCallback() {
    this.attachShadow({ mode: "open" }).innerHTML = "<style>label{display:block;margin:8px 0 2px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:6px;margin:2px 0}button{width:auto;padding:6px 14px}.row{margin:8px 0}</style><label for=\"p\">Wachtwoord</label><input id=\"p\" name=\"wachtwoord\" type=\"password\" autocomplete=\"current-password\">";
  }
});
</script>
</body>
</html>
