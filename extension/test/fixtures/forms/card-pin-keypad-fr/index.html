<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bon retour</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
.pad button { width: 44px; margin: 2px; }
</style>
</head>
<body>
<h1>Code PIN</h1>
<form id="f" method="post" action="/static/login-done.html">
<label for="pin">Code PIN</label>
<input id="pin" name="code_secret" type="password" inputmode="numeric" maxlength="4" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
<div class="pad"><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='1'">1</button><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='2'">2</button><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='3'">3</button><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='4'">4</button><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='5'">5</button><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='6'">6</button><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='7'">7</button><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='8'">8</button><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='9'">9</button><button type="button" onclick="var p=document.getElementById('pin');p.removeAttribute('readonly');p.value+='0'">0</button></div>
<div class="row"><button id="go" type="submit">Vérifier</button></div>
</form>
</body>
</html>
