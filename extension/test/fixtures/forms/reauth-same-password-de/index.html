<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willkommen zurück</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
.card { border: 1px solid #888; padding: 12px 16px; }
</style>
</head>
<body>
<h1>Willkommen zurück</h1>
<div class="card" role="dialog" aria-label="Bestätigen Sie Ihr Passwort, um fortzufahren">
<p>Bestätigen Sie Ihr Passwort, um fortzufahren</p>
<form id="f" method="post" action="/static/login-done.html">
<input type="hidden" name="user" value="account-1">
<input id="p" name="passwort" type="password" autocomplete="current-password" aria-label="Passwort">
<div class="row"><button id="go" type="submit">Fortfahren</button></div>
</form>
</div>
</body>
</html>
