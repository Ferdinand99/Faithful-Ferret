<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
#step2 { opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s; } #step2.show { opacity: 1; transform: none; } #step2[hidden] { display: none; }
</style>
</head>
<body>
<h1>Inloggen</h1>
<form id="login" method="post" action="/static/login-done.html">
<div id="step1">
<label for="u">E-mailadres</label>
<input id="u" name="identifier" type="text" autocomplete="username">
<div class="row"><button id="next" type="button">Volgende</button></div>
</div>
<div id="step2" hidden>
<label for="p">Wachtwoord</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<div class="row"><button id="go" type="submit">Inloggen</button></div>
</div>
</form>
<script>
var s1 = document.getElementById("step1"), s2 = document.getElementById("step2");
document.getElementById("next").addEventListener("click", function () { s1.hidden = true; s2.hidden = false; void s2.offsetWidth; s2.classList.add("show"); document.getElementById("p").focus(); });
</script>
</body>
</html>
