<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>News</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; }
label { display: block; margin: 8px 0 2px; }
input, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
button { width: auto; }
section { margin: 0; }
</style>
</head>
<body>
<!-- Not a case of the corpus: the page of the capture script's footprint test. A page of about two thousand elements
     and no password field, which is what most pages are. -->
<h1>News</h1>
<input id="q" name="q" type="search" aria-label="Search">
<main id="app"></main>
<script>
var app = document.getElementById("app");
for (var i = 0; i < 225; i += 1) {
  var section = document.createElement("section");
  section.className = "s";
  for (var j = 0; j < 4; j += 1) {
    var p = document.createElement("p");
    var a = document.createElement("a");
    a.href = "#" + i + "-" + j;
    a.textContent = "item " + i + "." + j;
    p.appendChild(a);
    section.appendChild(p);
  }
  app.appendChild(section);
}
</script>
</body>
</html>
