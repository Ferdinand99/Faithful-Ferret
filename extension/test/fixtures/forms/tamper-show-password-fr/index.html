<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bon retour</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
.pw { position: relative; } .pw input { padding-right: 70px; } .pw button { position: absolute; right: 4px; top: 4px; padding: 2px 8px; }
</style>
</head>
<body>
<h1>Se connecter</h1>
<form id="login" method="post" action="/static/login-done.html">
<label for="u">Identifiant</label>
<input id="u" name="identifiant" type="text" autocomplete="username">
<label for="p">Mot de passe</label>
<div class="pw"><input id="p" name="motdepasse" type="password" autocomplete="current-password"><button id="show" type="button">Afficher</button></div>
<div class="row"><button id="go" type="submit">Se connecter</button></div>
</form>
<script>
document.getElementById("show").addEventListener("click", function () {
  var p = document.getElementById("p");
  p.type = p.type === "password" ? "text" : "password";
});
</script>
</body>
</html>
