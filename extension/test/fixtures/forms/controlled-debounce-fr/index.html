<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se connecter</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Se connecter</h1>
<form id="login" method="post" action="/static/login-done.html">
<label for="u">Identifiant</label>
<input id="u" name="username" type="text" autocomplete="username">
<label for="p">Mot de passe</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<div class="row"><button id="go" type="submit">Se connecter</button></div>
</form>
<script>
var nativeValue = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
function nget(el) { return nativeValue.get.call(el); }
function nset(el, v) { nativeValue.set.call(el, v); }
var model = { u: "", p: "" }, pending = { u: false, p: false };
["u", "p"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", function (e) {
    var v = e.target.value;
    pending[id] = true;
    setTimeout(function () { model[id] = v; pending[id] = false; }, 40);
  });
});
setInterval(function () {
  ["u", "p"].forEach(function (id) { var el = document.getElementById(id); if (!pending[id] && el.value !== model[id]) el.value = model[id]; });
}, 130);
</script>
</body>
</html>
