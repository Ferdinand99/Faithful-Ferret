<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se connecter</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<div class="page"><div class="panel"><div class="inner"><div class="group">
<h1>Se connecter</h1>
<form id="login" method="post" action="/static/login-done.html">
<div class="row"><div class="field"><label for="u">Adresse e-mail</label><div class="wrap"><input id="u" name="email" type="text" autocomplete="email"></div></div></div>
<div class="row"><div class="field"><label for="p">Mot de passe</label><div class="wrap"><input id="p" name="motdepasse" type="password" autocomplete="current-password"></div></div></div>
<div class="row"><button id="go" type="submit">Se connecter</button></div>
</form>
</div></div></div></div>
</body>
</html>
