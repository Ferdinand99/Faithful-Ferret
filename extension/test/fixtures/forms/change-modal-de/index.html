<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort ändern</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); } .card { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); width: 380px; background: #fff; padding: 16px 20px; border-radius: 6px; z-index: 5; }
</style>
</head>
<body>
<p>Willkommen zurück</p><div class="backdrop"></div>
<div class="card" role="dialog" aria-modal="true"><h2>Passwort ändern</h2>
<form id="f" method="post" action="/static/login-done.html">
<label for="cur">Aktuelles Passwort</label>
<input id="cur" name="current_password" type="password" autocomplete="current-password">
<label for="new">Neues Passwort</label>
<input id="new" name="new_password" type="password" autocomplete="new-password">
<label for="new2">Passwort bestätigen</label>
<input id="new2" name="new_password_confirmation" type="password" autocomplete="new-password">
<div class="row"><button id="go" type="submit">Passwort ändern</button></div>
</form>
</div>
</body>
</html>
