<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se connecter</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
td { padding: 4px 8px 4px 0; } table input { width: 220px; }
</style>
</head>
<body>
<h1>Se connecter</h1>
<form id="login" method="post" action="/static/login-done.html">
<table>
<tr><td>Identifiant</td><td><input id="u" name="identifiant" type="text" autocomplete="username"></td></tr>
<tr><td>Mot de passe</td><td><input id="p" name="motdepasse" type="password" autocomplete="current-password"></td></tr>
<tr><td></td><td><button id="go" type="submit">Se connecter</button></td></tr>
</table>
</form>
</body>
</html>
