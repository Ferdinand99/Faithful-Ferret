<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); } .card { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); width: 360px; background: #fff; padding: 16px 20px; border-radius: 6px; z-index: 5; }
</style>
</head>
<body>
<p>Welcome back</p>
<div class="backdrop"></div>
<div class="card" role="dialog" aria-modal="true" aria-labelledby="dlg">
<h2 id="dlg">Sign in</h2>
<form id="login" method="post" action="/static/login-done.html">
<label for="u">User name</label>
<input id="u" name="username" type="text" autocomplete="username">
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<div class="row"><button id="go" type="submit">Sign in</button></div>
</form>
</div>
</body>
</html>
