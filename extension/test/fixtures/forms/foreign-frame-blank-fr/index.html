<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bon retour</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
iframe { width: 420px; height: 270px; border: 1px solid #bbb; }
</style>
</head>
<body>
<h1>Bon retour</h1>
<iframe id="login-frame" title="Se connecter"></iframe>
<script>
var d = document.getElementById("login-frame").contentDocument;
d.open();
d.write("<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Se connecter<\/title>\n<style>\nbody { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }\nlabel { display: block; margin: 8px 0 2px; }\ninput, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }\ninput[type=checkbox], input[type=radio] { width: auto; }\nbutton { width: auto; padding: 6px 14px; }\nfieldset { border: 1px solid #bbb; margin: 8px 0; }\n.row { margin: 8px 0; }\n.small { font-size: 13px; color: #555; }\n<\/style>\n<\/head>\n<body>\n<h1>Se connecter<\/h1>\n<form id=\"login\" method=\"post\" action=\"/static/login-done.html\">\n<label for=\"u\">Identifiant<\/label>\n<input id=\"u\" name=\"username\" type=\"text\" autocomplete=\"username\">\n<label for=\"p\">Mot de passe<\/label>\n<input id=\"p\" name=\"password\" type=\"password\" autocomplete=\"current-password\">\n<div class=\"row\"><button id=\"go\" type=\"submit\">Se connecter<\/button><\/div>\n<\/form>\n<\/body>\n<\/html>\n");
d.close();
</script>
</body>
</html>
