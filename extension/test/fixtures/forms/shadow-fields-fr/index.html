<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se connecter</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Se connecter</h1>
<form id="login" method="post" action="/static/login-done.html">
<field-box label="Identifiant" input-id="u" input-name="identifiant" input-type="text" ac="username"></field-box>
<field-box label="Mot de passe" input-id="p" input-name="motdepasse" input-type="password" ac="current-password"></field-box>
<div class="row"><button id="go" type="submit">Se connecter</button></div>
</form>
<script>
customElements.define("field-box", class extends HTMLElement {
  connectedCallback() {
    var root = this.attachShadow({ mode: "open" });
    root.innerHTML = "<style>label{display:block;margin:8px 0 2px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:6px;margin:2px 0}button{width:auto;padding:6px 14px}.row{margin:8px 0}</style>" + "<label></label><input>";
    root.querySelector("label").textContent = this.getAttribute("label");
    var i = root.querySelector("input");
    i.id = this.getAttribute("input-id"); i.name = this.getAttribute("input-name");
    i.type = this.getAttribute("input-type"); i.autocomplete = this.getAttribute("ac");
  }
});
</script>
</body>
</html>
