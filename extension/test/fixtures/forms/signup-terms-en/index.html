<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Create account</h1>
<form id="f" method="post" action="/static/login-done.html">
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email">
<label for="pw">Password</label>
<input id="pw" name="password" type="password" autocomplete="new-password">
<label for="pw2">Confirm password</label>
<input id="pw2" name="password2" type="password" autocomplete="new-password">
<div class="row"><label><input id="terms" type="checkbox" name="terms"> I accept the terms of use</label></div>
<div class="row"><label><input id="news" type="checkbox" name="news"> Send me news</label></div>
<div class="row"><button id="go" type="submit">Create account</button></div>
</form>
</body>
</html>
