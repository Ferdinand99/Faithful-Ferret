<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Sign in</h1>
<login-box></login-box>
<script>
customElements.define("login-box", class extends HTMLElement {
  connectedCallback() {
    var root = this.attachShadow({ mode: "open" });
    root.innerHTML = "<style>label{display:block;margin:8px 0 2px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:6px;margin:2px 0}button{width:auto;padding:6px 14px}.row{margin:8px 0}</style><form id=\"login\" method=\"post\" action=\"/static/login-done.html\">\n<label for=\"u\">User name</label>\n<input id=\"u\" name=\"username\" type=\"text\" autocomplete=\"username\">\n<label for=\"p\">Password</label>\n<input id=\"p\" name=\"password\" type=\"password\" autocomplete=\"current-password\">\n<div class=\"row\"><button id=\"go\" type=\"submit\">Sign in</button></div>\n</form>";
  }
});
</script>
</body>
</html>
