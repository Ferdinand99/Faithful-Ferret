<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controleren</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
.digits { display: flex; gap: 6px; } .digits input { width: 42px; text-align: center; }
</style>
</head>
<body>
<h1>Verificatiecode</h1>
<form id="otp-form" method="post" action="/static/login-done.html">
<div class="digits" role="group" aria-label="Verificatiecode">
<input id="d1" name="d1" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="1">
<input id="d2" name="d2" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="2">
<input id="d3" name="d3" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="3">
<input id="d4" name="d4" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="4">
<input id="d5" name="d5" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="5">
<input id="d6" name="d6" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="6">
</div>
<div class="row"><button id="go" type="submit">Controleren</button></div>
</form>
<script>
var boxes = Array.prototype.slice.call(document.querySelectorAll(".digits input"));
boxes.forEach(function (box, i) {
  box.addEventListener("input", function () {
    if (box.value.length === 1 && boxes[i + 1]) boxes[i + 1].focus();
  });
});
</script>
</body>
</html>
