<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen</title>
<style>
body { font: 16px/1.4 sans-serif; margin: 24px; max-width: 440px; color: #111; background: #fff; }
label { display: block; margin: 8px 0 2px; }
input, select, textarea, button { font: inherit; box-sizing: border-box; width: 100%; padding: 6px; margin: 2px 0; }
input[type=checkbox], input[type=radio] { width: auto; }
button { width: auto; padding: 6px 14px; }
fieldset { border: 1px solid #bbb; margin: 8px 0; }
.row { margin: 8px 0; }
.small { font-size: 13px; color: #555; }
.modal { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); width: 380px; background: #fff; padding: 16px 20px; border: 1px solid #888; z-index: 5; }
</style>
</head>
<body>
<p>Welkom terug</p>
<button id="open" type="button">Inloggen</button>
<div id="slot"></div>
<script>
document.getElementById("open").addEventListener("click", function () {
  document.getElementById("slot").innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h2>Inloggen</h2><label for="u">Gebruikersnaam</label><input id="u" name="username" type="text" autocomplete="username"><label for="p">Wachtwoord</label><input id="p" name="password" type="password" autocomplete="current-password"><div class="row"><button id="go" type="button">Inloggen</button></div></div>';
  document.getElementById("go").addEventListener("click", function () {
    fetch("/static/login-done.html", { method: "POST" }).then(function () { document.getElementById("slot").innerHTML = ""; });
  });
});
</script>
</body>
</html>
