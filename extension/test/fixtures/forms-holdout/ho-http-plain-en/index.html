<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Member login</title>
<style>body{font-family:sans-serif;max-width:320px;margin:70px auto}input{display:block;width:100%;box-sizing:border-box;padding:8px;margin:4px 0 12px}</style></head>
<body>
<h1>Member login</h1>
<form id="m" method="post" action="#m">
<label for="mu">Username</label><input id="mu" name="username" type="text" autocomplete="username">
<label for="mp">Password</label><input id="mp" name="password" type="password" autocomplete="current-password">
<button type="submit" id="mgo">Log in</button>
</form>
</body></html>
