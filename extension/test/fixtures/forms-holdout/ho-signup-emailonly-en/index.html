<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Join - Pebble Notes</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#102a43;color:#fff}.c{width:320px;margin:80px auto}input{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:4px;border:0}button{padding:12px;width:100%;background:#f0b429;border:0}</style></head>
<body>
<div class="c">
<h1>Start taking notes</h1>
<form action="#join" method="post" data-form="signup">
  <input type="email" id="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
  <input type="password" id="pw" name="password" placeholder="Choose a password" aria-label="Choose a password" autocomplete="new-password" required>
  <button id="create" type="submit">Create free account</button>
</form>
<p>Already a member? <a href="/login">Sign in</a></p>
</div>
</body></html>
