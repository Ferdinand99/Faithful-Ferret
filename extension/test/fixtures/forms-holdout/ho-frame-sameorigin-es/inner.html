<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Acceso</title>
<style>body{font-family:Verdana;margin:10px}input{display:block;width:100%;box-sizing:border-box;padding:7px;margin:4px 0 10px}</style></head>
<body>
<form id="faccess" method="post" action="#faccess">
<label for="fcorreo">Correo electrónico</label>
<input type="email" id="fcorreo" name="correo" autocomplete="username">
<label for="fclave">Contraseña</label>
<input type="password" id="fclave" name="clave" autocomplete="current-password">
<button type="submit" id="fentrar">Entrar</button>
</form>
</body></html>
