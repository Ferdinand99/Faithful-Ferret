<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Wachtwoord opnieuw instellen</title>
<style>body{font-family:Calibri,sans-serif;background:#f2f2f2}.m{max-width:380px;margin:60px auto;background:#fff;padding:24px}input{width:100%;padding:9px;box-sizing:border-box;margin:5px 0 14px}</style></head>
<body>
<div class="m">
<h1>Kies een nieuw wachtwoord</h1>
<form id="reset" method="post" action="#reset">
  <label for="nw">Nieuw wachtwoord</label>
  <input type="password" id="nw" name="nw" autocomplete="new-password">
  <label for="nw2">Bevestig nieuw wachtwoord</label>
  <input type="password" id="nw2" name="nw2" autocomplete="new-password">
  <button type="submit" id="opslaan">Opslaan</button>
</form>
</div>
</body></html>
