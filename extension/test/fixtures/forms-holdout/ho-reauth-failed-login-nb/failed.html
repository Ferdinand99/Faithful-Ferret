<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>Logg inn</title>
<style>body{font-family:sans-serif;max-width:340px;margin:60px auto}input{display:block;width:100%;box-sizing:border-box;padding:8px;margin:4px 0 12px}.feil{color:#a00;background:#fee;padding:8px}</style></head>
<body>
<h1>Logg inn</h1>
<p class="feil" role="alert">Feil brukernavn eller passord. Prøv igjen.</p>
<div id="slot"></div>
<script>
// The form comes back late, well after document_idle, as in client-rendered login pages.
setTimeout(function(){
  document.getElementById('slot').innerHTML='<form id="innlogging" method="get" action="failed.html">'
   +'<label for="bruker">Brukernavn</label><input id="bruker" name="u" type="text" autocomplete="username">'
   +'<label for="pass">Passord</label><input id="pass" name="p" type="password" autocomplete="current-password">'
   +'<button type="submit" id="go">Logg inn</button></form>';
}, 1500);
</script>
</body></html>
