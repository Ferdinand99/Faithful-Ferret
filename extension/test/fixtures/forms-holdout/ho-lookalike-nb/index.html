<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>Logg inn</title>
<style>body{font-family:sans-serif;max-width:340px;margin:60px auto}input{display:block;width:100%;box-sizing:border-box;padding:8px;margin:4px 0 12px}</style></head>
<body>
<h1>Logg inn på forms.example.net</h1>
<form id="skjema" method="post" action="#skjema">
<label for="lu">Brukernavn</label><input id="lu" name="u" type="text" autocomplete="username">
<label for="lp">Passord</label><input id="lp" name="p" type="password" autocomplete="current-password">
<button type="submit" id="lgo">Logg inn</button>
</form>
</body></html>
