<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>Logg inn</title>
<style>body{font-family:sans-serif;max-width:340px;margin:60px auto}.row{margin:10px 0}input{width:100%;padding:8px;box-sizing:border-box}</style></head>
<body>
<div id="app" class="login-box">
<h1>Logg inn</h1>
<div class="row"><label for="brukernavn">Brukernavn</label><input id="brukernavn" type="text" name="brukernavn" autocomplete="username"></div>
<div class="row"><label for="passord">Passord</label><input id="passord" type="password" name="passord" autocomplete="current-password"></div>
<button id="logginn" type="button">Logg inn</button>
<p id="status" aria-live="polite"></p>
</div>
<script>
(function(){
  var u=document.getElementById('brukernavn'), p=document.getElementById('passord'), s=document.getElementById('status');
  function send(){
    s.textContent='Logger inn ...';
    fetch('session', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({u:u.value,p:p.value})})
      .then(function(r){ s.textContent='Svar: '+r.status; })
      .catch(function(){ s.textContent='Nettverksfeil'; });
  }
  document.getElementById('logginn').addEventListener('click', send);
  p.addEventListener('keydown', function(e){ if(e.key==='Enter') send(); });
})();
</script>
</body></html>
