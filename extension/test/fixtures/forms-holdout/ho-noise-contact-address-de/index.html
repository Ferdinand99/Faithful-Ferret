<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Bestellung abschließen</title>
<style>body{font-family:Arial;background:#f7f7f7}form{max-width:460px;margin:20px auto;background:#fff;padding:18px}label{display:block;margin-top:10px}input,textarea{width:100%;box-sizing:border-box;padding:7px}</style></head>
<body>
<form id="lieferung" action="/bestellung/adresse" method="post">
<h2>Lieferadresse</h2>
<label for="vname">Vorname</label><input id="vname" name="fn" type="text" autocomplete="given-name">
<label for="strasse">Straße und Hausnummer</label><input id="strasse" name="street" type="text" autocomplete="street-address">
<label for="plz">PLZ</label><input id="plz" name="zip" type="text" autocomplete="postal-code">
<label for="ort">Ort</label><input id="ort" name="city" type="text" autocomplete="address-level2">
<label for="mail">E-Mail für die Bestellbestätigung</label><input id="mail" name="email" type="email" autocomplete="email">
<label for="gutschein">Gutscheincode</label><input id="gutschein" name="coupon" type="text" autocomplete="off">
<label for="nachricht">Nachricht an den Kundendienst</label><textarea id="nachricht" name="message" rows="3"></textarea>
<button type="submit" id="weiter">Weiter zur Zahlung</button>
</form>
</body></html>
