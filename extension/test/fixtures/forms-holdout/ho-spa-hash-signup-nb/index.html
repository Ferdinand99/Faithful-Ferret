<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>Bli med</title>
<style>body{font-family:sans-serif;background:#f5fbff}main{max-width:380px;margin:50px auto}input{display:block;width:100%;box-sizing:border-box;padding:8px;margin:4px 0 12px}[hidden]{display:none}</style></head>
<body>
<main>
<section id="view-signup">
  <h1>Opprett bruker</h1>
  <div id="signup-fields">
    <label for="epost">E-post</label><input id="epost" type="email" autocomplete="email">
    <label for="nyttpw">Passord</label><input id="nyttpw" type="password" autocomplete="new-password">
    <label for="nyttpw2">Bekreft passord</label><input id="nyttpw2" type="password" autocomplete="new-password">
    <button id="opprett" type="button">Opprett bruker</button>
  </div>
</section>
<section id="view-done" hidden><h1>Velkommen!</h1><p>Sjekk innboksen din.</p></section>
</main>
<script>
(function(){
  document.getElementById('opprett').addEventListener('click', function(){
    var a=document.getElementById('nyttpw').value, b=document.getElementById('nyttpw2').value;
    if(!a || a!==b) return;
    var s=document.getElementById('view-signup');
    s.parentNode.removeChild(s);
    document.getElementById('view-done').hidden=false;
    location.hash='#/velkommen';
  });
})();
</script>
</body></html>
