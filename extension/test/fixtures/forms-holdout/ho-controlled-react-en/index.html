<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in</title>
<style>body{font-family:sans-serif;background:#fafafa}#app{max-width:340px;margin:60px auto}input{display:block;width:100%;box-sizing:border-box;padding:9px;margin:4px 0 12px}button[disabled]{opacity:.5}</style></head>
<body>
<div id="app"></div>
<script>
// Hand-rolled controlled-component pattern: state is the source of truth,
// the DOM value is rewritten from state after every render.
(function(){
  var state={user:'',pass:'',busy:false};
  var app=document.getElementById('app');
  app.innerHTML='<h1>Sign in</h1><form id="login-form" novalidate>'
    +'<label for="cu">Email</label><input id="cu" name="user" type="text" autocomplete="username">'
    +'<label for="cp">Password</label><input id="cp" name="pass" type="password" autocomplete="current-password">'
    +'<button id="cgo" type="submit">Sign in</button><p id="cmsg"></p></form>';
  var cu=document.getElementById('cu'), cp=document.getElementById('cp'), go=document.getElementById('cgo');
  function render(){
    if(cu.value!==state.user) cu.value=state.user;
    if(cp.value!==state.pass) cp.value=state.pass;
    go.disabled = !(state.user && state.pass) || state.busy;
  }
  cu.addEventListener('input', function(e){ state.user=e.target.value.trim(); render(); });
  cp.addEventListener('input', function(e){ state.pass=e.target.value; render(); });
  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    if(!(state.user && state.pass)) return;
    state.busy=true; render();
    fetch('auth', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:state.user,pass:state.pass})})
      .catch(function(){}).then(function(){ state.busy=false; document.getElementById('cmsg').textContent='Request sent'; render(); });
  });
  render();
})();
</script>
</body></html>
