<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Partner sign in</title>
<style>body{font-family:sans-serif;margin:12px}input{display:block;width:100%;box-sizing:border-box;padding:7px;margin:4px 0 10px}</style></head>
<body>
<form id="pform" method="post" action="#pform">
<label for="pemail">Email</label><input id="pemail" name="email" type="email" autocomplete="username">
<label for="ppass">Password</label><input id="ppass" name="password" type="password" autocomplete="current-password">
<button type="submit" id="pgo">Sign in</button>
</form>
</body></html>
