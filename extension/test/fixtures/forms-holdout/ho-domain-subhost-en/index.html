<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shop sign in</title>
<style>body{font-family:sans-serif;max-width:340px;margin:60px auto}input{display:block;width:100%;box-sizing:border-box;padding:8px;margin:4px 0 12px}</style></head>
<body>
<h1>Shop sign in</h1>
<form id="shop" method="post" action="#shop">
<label for="su">Username</label><input id="su" name="u" type="text" autocomplete="username">
<label for="sp">Password</label><input id="sp" name="p" type="password" autocomplete="current-password">
<button type="submit" id="sgo">Sign in</button>
</form>
</body></html>
