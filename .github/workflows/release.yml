# Builds the release packages of the WebAssembly binding for a tag, signs them
# with keyless cosign and attaches them to the GitHub release of that tag, and
# builds, publishes and signs the server image (linux/amd64 and linux/arm64) for
# the same tag. The packages:
#
#   ferret-core-wasm-web-<version>.tar.gz    pkg-web and the worker client js/
#   ferret-core-wasm-node-<version>.tar.gz   pkg-node
#   ferret-core-wasm-<version>.cdx.json      CycloneDX SBOM of the release graph
#   SHA256SUMS                               SHA-256 of the files above
#   <file>.sigstore.json                     the cosign bundle of each file
#
# Called by release-please.yml once the release pull request is merged. It can
# also be started by hand, from main or from a v* tag only, for a tag that
# exists (Actions, Release, Run workflow), for example when a run failed before
# it uploaded anything. The GitHub release itself is made by release-please;
# this workflow only attaches files to it, never replaces one that is there,
# and never creates a tag or a release. The publish job runs in the protected
# environment "release".
#
# The server image is ghcr.io/<account>/faithful-ferret:<version>, signed by digest with
# keyless cosign (the same identity as the packages: this workflow). Its labels carry
# the version and the commit of the tag; scripts/ferret-home.sh checks both, and the
# signature, before it starts a stack with real data. Nothing is tagged before the
# protected environment "release" approves the publish job.
#
# The package build job has read access only. The publish job gets the write access
# and the OIDC token, and it runs no code from the repository: it only handles
# the files it downloads from the build job.
#
# The image build jobs are different, and the difference is deliberate: they have `packages: write`
# so that each one can push its platform image by digest, and they run the Dockerfile of the tag
# (BuildKit gets no registry credentials, so build steps cannot use the token; the actions
# in those jobs can). What such a token can do is limited by what comes after: a digest without a
# tag is not referenced by anything, the tag and the signature come from the publish job under
# the protected environment, and `scripts/ferret-home.sh up` starts only an image with a good
# signature from this workflow.
# Third-party actions are pinned by commit SHA; tools by version and checksum.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag to build, for example v0.1.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, for example v0.1.0 (it must already have a GitHub release)"
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The same versions as .github/workflows/wasm.yml and docker/builder.Dockerfile.
  WASM_PACK_VERSION: 0.15.0
  WASM_BINDGEN_CLI_VERSION: 0.2.129
  CARGO_CYCLONEDX_VERSION: 0.5.9
  BINARYEN_VERSION: version_133
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
  NODE_VERSION: 22.23.4
  NODE_SHA256: 1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce

jobs:
  build:
    name: Build and test the packages
    # Only from main (release-please calls this workflow there) or from a
    # release tag; a copy on any other branch does not run.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: The tag must look like a version
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: The tag and the workspace version agree
        id: version
        run: |
          version="${TAG#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml)"
          [ "$cargo_version" = "$version" ] || { echo "Cargo.toml says $cargo_version, the tag says $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The Public Suffix List snapshot is not too old
        run: scripts/check-psl-age.sh
      # No cache in a release build: nothing from an earlier run is reused.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack, wasm-bindgen-cli and cargo-cyclonedx
        run: cargo install --locked "wasm-pack@${WASM_PACK_VERSION}" "wasm-bindgen-cli@${WASM_BINDGEN_CLI_VERSION}" "cargo-cyclonedx@${CARGO_CYCLONEDX_VERSION}"
      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/binaryen"
          tar -xz -C "$RUNNER_TEMP/binaryen" --strip-components=1 -f "$RUNNER_TEMP/binaryen.tar.gz"
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
      - name: Install Node
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJ -C "$RUNNER_TEMP/node" --strip-components=1 -f "$RUNNER_TEMP/node.tar.xz"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Build pkg-web and pkg-node (the release build, without test-support)
        run: scripts/build-wasm.sh
      - name: The release build exports nothing from test-support
        run: scripts/check-no-test-support.sh
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-release.sh package "$VERSION" dist
      - name: Test the packages (no test support, checksums, reproducible)
        run: node --test tests/node/release.test.mjs
      - name: SBOM (CycloneDX) of the release graph
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo cyclonedx --manifest-path bindings/wasm/Cargo.toml --format json --spec-version 1.5 \
            --target wasm32-unknown-unknown --override-filename "ferret-core-wasm-${VERSION}.cdx"
          mv "bindings/wasm/ferret-core-wasm-${VERSION}.cdx.json" dist/
          scripts/package-release.sh checksums dist
      - name: Check the files once more
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and attach to the GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # A protected environment (required reviewer, deployment only from main
    # and v* tags) is set up by the maintainer in the repository settings.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: What was built is what is signed
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      # The installer checks the cosign release against a checksum that is
      # part of the pinned installer, so its default cosign version is used.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every file (keyless)
        working-directory: dist
        run: |
          for f in ferret-core-wasm-*.tar.gz ferret-core-wasm-*.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify the signatures against this workflow
        working-directory: dist
        run: |
          for f in ferret-core-wasm-*.tar.gz ferret-core-wasm-*.cdx.json SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
      - name: Attach to the release of the tag (never replaces an asset)
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || { echo "$TAG has no GitHub release; merge the release pull request first" >&2; exit 1; }
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in dist/*; do
            if printf '%s\n' "$existing" | grep -Fxq "$(basename "$f")"; then
              echo "$(basename "$f") is already on the release $TAG; an asset is never replaced" >&2
              exit 1
            fi
          done
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  # The server image: one image for linux/amd64 and linux/arm64, built from the tag on a native runner
  # of each architecture (no emulation), without cargo features (a release build, nothing from the
  # test stacks), with the version and the commit of the tag in its labels. The build jobs
  # push each platform image by digest only (no tag): nothing refers to it until the publish job,
  # which runs in the protected environment "release", gives the tag and signs.
  image:
    name: Build the server image (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      TAG: ${{ inputs.tag }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: The tag must look like a version
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: The tag, the workspace version and the commit agree
        id: meta
        run: |
          version="${TAG#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml)"
          [ "$cargo_version" = "$version" ] || { echo "Cargo.toml says $cargo_version, the tag says $version" >&2; exit 1; }
          revision="$(git rev-parse HEAD)"
          [ "$revision" = "$(git rev-parse "refs/tags/${TAG}^{commit}")" ] || { echo "the checkout is not the commit of $TAG" >&2; exit 1; }
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/faithful-ferret"
            echo "pair=$(printf '%s' "${{ matrix.platform }}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest (no tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            FEATURES=
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.revision }}
          # One manifest per platform, nothing else in it: the publish job puts the two together.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Note the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PAIR: ${{ steps.meta.outputs.pair }}
        run: |
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "no digest" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          : > "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "$PAIR $DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ steps.meta.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  image-publish:
    name: Publish and sign the server image
    needs: image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # The same protected environment as the packages above.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Give the two platform images one tag (never replaces a tag)
        run: |
          version="${TAG#v}"
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG" >&2; exit 1; }
          if docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "$IMAGE:$version already exists; an image tag is never replaced" >&2
            exit 1
          fi
          digest_files=(digests/*)
          [ "${#digest_files[@]}" = 2 ] || { echo "expected one digest for each of two platforms, got: ${digest_files[*]}" >&2; exit 1; }
          refs=()
          for d in digests/*; do refs+=("$IMAGE@sha256:$(basename "$d")"); done
          docker buildx imagetools create -t "$IMAGE:$version" "${refs[@]}"
      - name: The image has linux/amd64 and linux/arm64
        run: |
          version="${TAG#v}"
          docker buildx imagetools inspect --raw "$IMAGE:$version" > manifest.json
          jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' manifest.json | sort > platforms.txt
          cat platforms.txt
          for platform in "linux/amd64" "linux/arm64"; do
            grep -qx "$platform" platforms.txt || { echo "the published image has no $platform" >&2; exit 1; }
          done
          [ "$(wc -l < platforms.txt)" = 2 ] || { echo "the published image has platforms other than the two" >&2; exit 1; }
      - name: Sign the image by digest (keyless) and verify the signature against this workflow
        run: |
          version="${TAG#v}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{.Manifest.Digest}}')"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "no digest for $IMAGE:$version" >&2; exit 1; }
          cosign sign --yes "$IMAGE@$digest"
          cosign verify "$IMAGE@$digest" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "$IMAGE:$version" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
