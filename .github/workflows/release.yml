# Builds the release packages of the WebAssembly binding for a tag, signs them
# with keyless cosign and attaches them to the GitHub release of that tag:
#
#   ferret-core-wasm-web-<version>.tar.gz    pkg-web and the worker client js/
#   ferret-core-wasm-node-<version>.tar.gz   pkg-node
#   ferret-core-wasm-<version>.cdx.json      CycloneDX SBOM of the release graph
#   SHA256SUMS                               SHA-256 of the files above
#   <file>.sigstore.json                     the cosign bundle of each file
#
# Called by release-please.yml once the release pull request is merged. It can
# also be started by hand for a tag that exists (Actions, Release, Run
# workflow), for example when a run failed half way. The GitHub release itself
# is made by release-please; this workflow only attaches files to it and never
# creates a tag or a release.
#
# The build job has read access only. The publish job gets the write access
# and the OIDC token, and it runs no code from the repository: it only handles
# the files it downloads from the build job.
# Third-party actions are pinned by commit SHA; tools by version and checksum.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag to build, for example v0.1.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, for example v0.1.0 (it must already have a GitHub release)"
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The same versions as .github/workflows/wasm.yml and docker/builder.Dockerfile.
  WASM_PACK_VERSION: 0.15.0
  WASM_BINDGEN_CLI_VERSION: 0.2.129
  CARGO_CYCLONEDX_VERSION: 0.5.9
  BINARYEN_VERSION: version_133
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
  NODE_VERSION: 22.23.4
  NODE_SHA256: 1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce

jobs:
  build:
    name: Build and test the packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: The tag must look like a version
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: The tag and the workspace version agree
        id: version
        run: |
          version="${TAG#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml)"
          [ "$cargo_version" = "$version" ] || { echo "Cargo.toml says $cargo_version, the tag says $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The Public Suffix List snapshot is not too old
        run: scripts/check-psl-age.sh
      # No cache in a release build: nothing from an earlier run is reused.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack, wasm-bindgen-cli and cargo-cyclonedx
        run: cargo install --locked "wasm-pack@${WASM_PACK_VERSION}" "wasm-bindgen-cli@${WASM_BINDGEN_CLI_VERSION}" "cargo-cyclonedx@${CARGO_CYCLONEDX_VERSION}"
      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/binaryen"
          tar -xz -C "$RUNNER_TEMP/binaryen" --strip-components=1 -f "$RUNNER_TEMP/binaryen.tar.gz"
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
      - name: Install Node
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJ -C "$RUNNER_TEMP/node" --strip-components=1 -f "$RUNNER_TEMP/node.tar.xz"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Build pkg-web and pkg-node (the release build, without test-support)
        run: scripts/build-wasm.sh
      - name: The release build exports nothing from test-support
        run: scripts/check-no-test-support.sh
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-release.sh package "$VERSION" dist
      - name: Test the packages (no test support, checksums, reproducible)
        run: node --test tests/node/release.test.mjs
      - name: SBOM (CycloneDX) of the release graph
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo cyclonedx --manifest-path bindings/wasm/Cargo.toml --format json --spec-version 1.5 \
            --target wasm32-unknown-unknown --override-filename "ferret-core-wasm-${VERSION}.cdx"
          mv "bindings/wasm/ferret-core-wasm-${VERSION}.cdx.json" dist/
          scripts/package-release.sh checksums dist
      - name: Check the files once more
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and attach to the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: What was built is what is signed
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      # The installer checks the cosign release against a checksum that is
      # part of the pinned installer, so its default cosign version is used.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every file (keyless)
        working-directory: dist
        run: |
          for f in ferret-core-wasm-*.tar.gz ferret-core-wasm-*.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify the signatures against this workflow
        working-directory: dist
        run: |
          for f in ferret-core-wasm-*.tar.gz ferret-core-wasm-*.cdx.json SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/(release|release-please)\.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
      - name: Attach to the release of the tag
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || { echo "$TAG has no GitHub release; merge the release pull request first" >&2; exit 1; }
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
