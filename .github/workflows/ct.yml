# Constant-time checks (plan section 10), on GitHub-hosted runners:
#
#   analyzer     ct_analyzer on ct/harness/*.rs (x86_64 and arm64, O0 O2 O3 Os,
#                with --warnings) and the triage in ct/TRIAGE.md.
#   wasm-scan    division, remainder, br_table and indexed loads in the WASM
#                build, against ct/wasm-allow.toml.
#   dudect-smoke dudect, native and WebAssembly in Node, 100 000 measurements.
#
# The timing tests are split in two on purpose. A hosted runner is a shared
# virtual machine: its clock is jittery and its neighbours change from one
# minute to the next, and the threshold of dudect (|t| < 4.5) is a statement
# about differences of a fraction of a nanosecond after a million
# measurements. So here the smoke job checks that the harness builds and runs,
# that the controls behave (`control_leaky` must be seen, or the run is not
# valid) and prints the t-values, and a bench over the threshold is a warning.
# The run that decides is `scripts/lanbox-ct.sh` (modes `dudect-native` and
# `dudect-wasm`, or all of them):
# 1 000 000 measurements per bench on a pinned core of the LANBox, where the
# result is written to the report of the task.
#
# Third-party actions are pinned by commit SHA, tools by version and checksum,
# the analyzer by commit and SHA-256 (ct/analyzer.pin). The workflow has read
# access only and never uses `pull_request_target`.
name: Constant time

on:
  pull_request:
    paths:
      - "ct/**"
      - "crates/ferret-core/**"
      - "bindings/wasm/**"
      - "scripts/lanbox-ct.sh"
      - "docker/builder.Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ct.yml"
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: ct-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_TOOLS_VERSION: 1.262.0
  NODE_VERSION: 22.23.4
  NODE_SHA256: 1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce

jobs:
  analyzer:
    name: ct_analyzer and triage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: The analyzer pin and the builder image agree
        run: |
          set -eu
          commit="$(sed -n 's/^commit=//p' ct/analyzer.pin)"
          grep -q "CT_ANALYZER_COMMIT=${commit}" docker/builder.Dockerfile
          sed -n 's/^sha256 [^=]*=//p' ct/analyzer.pin | while read -r sum; do
            grep -q "${sum}" docker/builder.Dockerfile
          done
      - name: Install Node
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJ -C "$RUNNER_TEMP/node" --strip-components=1 -f "$RUNNER_TEMP/node.tar.xz"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch the analyzer (pinned commit, checked SHA-256)
        run: echo "CT_ANALYZER=$(ct/fetch-analyzer.sh "$RUNNER_TEMP/ct-analyzer")" >> "$GITHUB_ENV"
      - name: ct_analyzer on every harness file, two architectures, four levels
        run: ct/run.sh analyze
      - name: Every finding is triaged (ct_analyzer_clean_or_triaged)
        run: ct/run.sh triage
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-analyzer-reports
          path: ct/results/analyzer
          if-no-files-found: ignore
          retention-days: 14

  wasm-scan:
    name: WebAssembly scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-tools
        run: cargo install --locked "wasm-tools@${WASM_TOOLS_VERSION}"
      - name: Install Node
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJ -C "$RUNNER_TEMP/node" --strip-components=1 -f "$RUNNER_TEMP/node.tar.xz"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Only allow-listed instructions in our functions (wasm_scan_only_allowlisted)
        run: ct/run.sh wasm-scan
      - name: Keep the scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-wasm-scan
          path: ct/results/wasm/scan.txt
          if-no-files-found: ignore
          retention-days: 14

  dudect-smoke:
    name: dudect smoke run (not the decisive run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Node
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJ -C "$RUNNER_TEMP/node" --strip-components=1 -f "$RUNNER_TEMP/node.tar.xz"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: dudect, native (100 000 measurements per bench; a t over 4.5 is a warning here)
        env:
          CT_SMOKE: "1"
          FERRET_CT_N: "100000"
        run: ct/run.sh dudect-native
      - name: dudect, WebAssembly in Node (the same)
        env:
          CT_SMOKE: "1"
          FERRET_CT_N: "100000"
        run: ct/run.sh dudect-wasm
      - name: Keep the t-values
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-dudect-smoke
          path: |
            ct/results/dudect-native.txt
            ct/results/dudect-wasm.txt
          if-no-files-found: ignore
          retention-days: 14
