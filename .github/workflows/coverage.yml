# Line and branch coverage of the core against the thresholds of plan section
# 9.3 (scripts/coverage-thresholds.json): cargo llvm-cov --branch on the pinned
# nightly of fuzz/NIGHTLY, checked by scripts/coverage-check.mjs. It runs on
# pull requests that touch the core or the code it includes from ct/harness,
# and once a week. The same measurement runs on the LANBox with
# scripts/lanbox-coverage.sh.
# Third-party actions are pinned by commit SHA.
name: Coverage

on:
  pull_request:
    paths:
      - "crates/ferret-core/**"
      - "ct/harness/**"
      - "vectors/**"
      - "fuzz/NIGHTLY"
      - "scripts/coverage-check.mjs"
      - "scripts/coverage-thresholds.json"
      - ".github/workflows/coverage.yml"
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_LLVM_COV_VERSION: "0.9.1"
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the pinned nightly toolchain
        run: |
          nightly="$(tr -d '[:space:]' < fuzz/NIGHTLY)"
          rustup toolchain install "$nightly" --profile minimal --component llvm-tools
          echo "RUSTUP_TOOLCHAIN=$nightly" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install --locked "cargo-llvm-cov@${CARGO_LLVM_COV_VERSION}"
      - run: cargo llvm-cov --branch -p ferret-core --features test-support --json --summary-only --output-path cov.json
      - name: Summary
        if: always()
        run: |
          [ -f cov.json ] && node scripts/coverage-check.mjs cov.json --markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Check the thresholds
        run: node scripts/coverage-check.mjs cov.json
