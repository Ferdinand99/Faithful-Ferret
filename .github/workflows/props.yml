# The property tests of the core with 20 000 cases each.
# The pull request job (ci.yml, "Tests") runs them at the default 512 cases.
# A failing case is shrunk and written to proptest-regressions/; those files
# are uploaded so the case can be committed, and a committed regression is
# replayed first on every run.
# Third-party actions are pinned by commit SHA.
name: Props

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases per property"
        default: "20000"
  pull_request:
    paths:
      - ".github/workflows/props.yml"

concurrency:
  group: props-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A change to this workflow runs a short pass, to show that it works.
  PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '512' || (github.event.inputs.cases || '20000') }}

jobs:
  props:
    name: Properties (${{ github.event_name == 'pull_request' && '512' || (github.event.inputs.cases || '20000') }} cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p ferret-core --test "props_*" --test sheet --test opaque_client
      - name: Keep the failing cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proptest-regressions
          path: "**/proptest-regressions/**"
          retention-days: 30
          if-no-files-found: ignore
