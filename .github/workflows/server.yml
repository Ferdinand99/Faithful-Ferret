# The server (crates/ferret-server): a workspace of its own with a lock file and
# a cargo-deny policy of its own, because it builds on vole-kit. Format, lints,
# tests, the dependency policy, and the check that its lock agrees with the root
# lock where the crypto is.
#
# Third-party actions are pinned by commit SHA, tools by version and checksum.
# The workflow has read access only and never uses `pull_request_target`.
name: Server

on:
  pull_request:
    paths:
      - "crates/ferret-server/**"
      - "crates/ferret-core/**"
      - "crates/ferret-server-auth/**"
      - "docs/design/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ct/check-lock-sums.sh"
      - "release-please-config.json"
      - ".github/workflows/server.yml"
  push:
    branches: [main]

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The same cargo-deny as the builder image (docker/builder.Dockerfile), from
  # the release archive, checked against its SHA-256.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path crates/ferret-server/Cargo.toml --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/ferret-server
      - run: cargo clippy --manifest-path crates/ferret-server/Cargo.toml --locked --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/ferret-server
      - run: cargo test --manifest-path crates/ferret-server/Cargo.toml --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/deny.tar.gz"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      - run: cargo deny --manifest-path crates/ferret-server/Cargo.toml --all-features --config crates/ferret-server/deny.toml check

  lock:
    name: Lock agrees with the root lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - run: crates/ferret-server/check-lock.sh
