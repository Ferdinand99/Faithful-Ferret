# Dependency policy (advisories, licenses, bans, sources) with cargo-deny, and
# cargo-vet:
# on every pull request that touches Cargo files, on pushes to main, and once
# a week so a new advisory against an unchanged lock file is noticed too.
name: Audit

on:
  pull_request:
    paths: ["**/Cargo.lock", "**/Cargo.toml", "deny.toml", "supply-chain/**", ".github/workflows/audit.yml"]
  push:
    branches: [main]
    paths: ["**/Cargo.lock", "**/Cargo.toml", "deny.toml", "supply-chain/**", ".github/workflows/audit.yml"]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  vet:
    name: cargo-vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install --locked cargo-vet@0.10.3
      - run: cargo vet --locked
