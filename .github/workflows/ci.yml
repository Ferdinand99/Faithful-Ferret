# Format, lints, tests and vector checks for the Rust workspace.
# Third-party actions are pinned by commit SHA; the toolchain matches
# rust-toolchain.toml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: rustfmt
      - run: cargo fmt --check
      # ct/harness/*.rs is included into the core with include!, which cargo fmt
      # does not follow.
      - run: rustfmt --check --edition 2024 ct/harness/*.rs

  clippy:
    name: Clippy (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: native
            args: --workspace --all-targets
          - target: wasm32-unknown-unknown
            args: -p ferret-core -p ferret-core-wasm --target wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy ${{ matrix.args }} -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace

  # A broken link or a private item in the docs of the crates that are read
  # from outside fails the build, so the module documentation (the order of
  # the steps, the errors, the spec references) stays readable.
  docs:
    name: Rust docs build without warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo doc --no-deps -p ferret-core -p ferret-server-auth
        env:
          RUSTDOCFLAGS: -D warnings

  vectors:
    name: Vectors are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo run -p ferret-vectorgen --bin vectorgen -- check

  no-test-support:
    name: test-support stays out of releases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - run: scripts/check-no-test-support.sh --self-test
      - run: scripts/check-no-test-support.sh

  nightly-pin:
    name: Fuzz nightly matches the builder image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check-nightly-pin.sh

  passkey-api:
    name: Passkey API returns no key material
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check-passkey-api.sh --self-test
      - run: scripts/check-passkey-api.sh

  lanbox-labels:
    name: lanbox.sh run labels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck scripts/check-lanbox-labels.sh
      - run: scripts/check-lanbox-labels.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo +1.88 check -p ferret-core --features test-support
      - run: cargo +1.88 check -p ferret-server-auth --features test-support

  # THIRD-PARTY-NOTICES lists the licence texts of the Rust crates inside the server binary and the
  # WebAssembly module, and of the font in the web vault. It is made from the dependencies
  # (scripts/notices.sh), so a changed dependency makes it stale: this job fails then. It also
  # fails when a dependency has a licence that is not on the allowlist in about.toml, or no
  # licence text at all. The Docker image and the release archives carry the file (checked by
  # scripts/check-ferret-test-stack.sh and tests/node/release.test.mjs).
  notices:
    name: Third-party notices (up to date, licences allowed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Pinned version and pinned checksum. Keep the version equal to want_version in
      # scripts/notices.sh.
      - name: Install cargo-about
        env:
          CARGO_ABOUT_VERSION: "0.9.3"
          CARGO_ABOUT_SHA256: "3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4"
        run: |
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/cargo-about.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${name}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$HOME/.local/bin" --strip-components=1 "${name}/cargo-about"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tests of the notices scripts
        run: node --test "scripts/*.test.mjs"

      # --fail is what makes an unreadable licence stop the check; this test proves it.
      - name: cargo-about stops on a crate with an unreadable licence
        run: scripts/test-notices-fail.sh

      - name: THIRD-PARTY-NOTICES is up to date
        run: scripts/notices.sh --check
