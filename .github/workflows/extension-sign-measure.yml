# Signs the extension's test variant (the measurement build) with Mozilla (AMO,
# unlisted channel) so it can be installed permanently in an ordinary Firefox, and
# keeps the signed .xpi as an artifact of the run.
#
# Manual only: `workflow_dispatch`, never on a push, a tag or a pull request. Run it
# on the `ext` branch (`gh workflow run extension-sign-measure.yml --ref ext -f
# manifest=mv3`); a copy of this file on `main` is what lets GitHub list and dispatch
# it, and the build uses the code of the ref the run was started on.
#
# The signing job belongs to the environment `amo-signing`. AMO_JWT_ISSUER and
# AMO_JWT_SECRET are secrets of that environment, not repository secrets. The
# environment has a required reviewer, so every signing waits for an approval click,
# and it allows deployments from the `ext` branch only, so a run from any other ref
# never gets the secrets. The secrets are read by the signing step only, through the
# environment of that step (web-ext reads WEB_EXT_API_KEY and WEB_EXT_API_SECRET),
# never as command-line flags and never printed. The input reaches the shell through
# the environment as well, never spliced into a command line or into script text.
# The workflow has read access to the repository and nothing else; third-party
# actions are pinned by commit SHA.
#
# A run signs one build. AMO refuses the same version twice, so every attempt of
# every run gets a version of its own (0.0.<run number>.<attempt>). The manifest
# version (mv3, the default, or mv2, the fallback) is an input of the run. The
# signed file is the TEST variant (add-on id ferret-test@hedgerow.tools, with the
# measure page and test bridge). It is made for the lifetime measurement and is not
# a release: a release is built and checked by extension.yml, which never signs
# anything.
name: Extension sign measurement build

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Manifest version of the build to sign (mv3 is the default; mv2 is the fallback to measure against it)
        type: choice
        options: [mv3, mv2]
        default: mv3

concurrency:
  group: extension-sign-measure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sign:
    name: Build and sign the measurement build
    runs-on: ubuntu-24.04
    environment: amo-signing
    # web-ext waits up to 15 minutes for Mozilla's answer; the approval click comes before the job starts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the locked packages
        working-directory: extension
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build the test variant (fetches the published WASM package and checks its SHA-256)
        working-directory: extension
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: node scripts/build.mjs --browser firefox --manifest "$MANIFEST" --variant test
      # AMO wants a version it has not seen. The manifest of this one build gets
      # its own; the source tree is not changed. Then the step refuses anything but
      # the test variant: AMO keeps an add-on id for good, so a build under the
      # release id must never be signed from here.
      - name: Give the build its own version and check what is signed
        working-directory: extension
        env:
          MANIFEST: ${{ inputs.manifest }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node -e '
            const fs = require("fs");
            const { MANIFEST, RUN_NUMBER, RUN_ATTEMPT } = process.env;
            const file = `dist/ferret-firefox-${MANIFEST}-test/manifest.json`;
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            const id = manifest.browser_specific_settings?.gecko?.id;
            if (id !== "ferret-test@hedgerow.tools") throw new Error(`the add-on id is ${id}, not the test id`);
            if (!String(manifest.name).endsWith(" (test)")) throw new Error("the name is not the test variant name");
            if (manifest.manifest_version !== (MANIFEST === "mv3" ? 3 : 2)) throw new Error("the manifest version is not the one asked for");
            manifest.version = `0.0.${RUN_NUMBER}.${RUN_ATTEMPT}`;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
            console.log(`Signing version ${manifest.version} of ${id} (${MANIFEST})`);
          '
      - name: Sign with Mozilla (unlisted)
        working-directory: extension
        env:
          MANIFEST: ${{ inputs.manifest }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npm exec --no -- web-ext sign \
            --source-dir "dist/ferret-firefox-${MANIFEST}-test" \
            --artifacts-dir "$RUNNER_TEMP/signed" \
            --channel unlisted \
            --approval-timeout 900000
      - name: Name the signed file
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          count="$(find "$RUNNER_TEMP/signed" -maxdepth 1 -name '*.xpi' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one signed .xpi, found $count."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          mv "$RUNNER_TEMP/signed"/*.xpi "$RUNNER_TEMP/out/ferret-measure-${MANIFEST}-signed.xpi"
          sha256sum "$RUNNER_TEMP/out/ferret-measure-${MANIFEST}-signed.xpi"
      # The repository is public, so the artifact can be downloaded by any signed-in
      # GitHub user: keep it for a day, enough to fetch it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferret-measure-${{ inputs.manifest }}-signed
          path: ${{ runner.temp }}/out/ferret-measure-${{ inputs.manifest }}-signed.xpi
          if-no-files-found: error
          retention-days: 1
