# The browser extension (extension/): builds of both manifest versions in both
# variants, type check and unit tests, then `web-ext lint` and the release check,
# with the unsigned release packages kept as artifacts. Nothing is signed or
# submitted anywhere: there is no store key in this workflow and no signing step.
# Third-party actions are pinned by commit SHA, the Playwright image (which
# carries Node and npm) by digest. The workflow has read access only and never
# uses `pull_request_target`.
name: Extension

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Build, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Playwright 1.64.1 on Ubuntu 24.04. Keep the tag and the digest in step
      # with scripts/lanbox-ext.sh and the web vault's workflow.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      HOME: /root
      CI: "1"
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the locked packages
        run: npm ci --no-audit --no-fund --ignore-scripts
      # Both variants take the published package (fetched and checked against its SHA-256). A release
      # with the unlock or the passkeys feature on is refused when that package lacks their functions
      # (status 10 of release-build.sh: the lock is older than the release that has them, said as a warning).
      - name: Build both manifest versions in both variants
        run: |
          for mv in mv3 mv2; do
            bash scripts/release-build.sh "$mv" || [ $? -eq 10 ]
            node scripts/build.mjs --browser firefox --manifest "$mv" --variant test --wasm lock
          done
      - name: Type check
        run: npm exec --no -- tsc -p jsconfig.json --noEmit
      - name: Unit tests
        run: node --test "test/unit/*.test.mjs"

  lint:
    name: Lint and release check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      HOME: /root
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the locked packages
        working-directory: extension
        run: npm ci --no-audit --no-fund --ignore-scripts
      # While the locked WASM package lacks the unlock or the passkey functions, the release build is refused on
      # purpose and there is no release package: the script lints the test variant instead and leaves
      # extension/dist/.release-skipped, and the steps below that need a release package are skipped and say so
      # (extension/scripts/lint-release.sh). The pin change that moves the lock to 0.12.0 removes the rule.
      - name: Build the release packages and lint them
        working-directory: extension
        run: bash scripts/lint-release.sh
      - name: Check the release packages
        run: |
          if [ -f extension/dist/.release-skipped ]; then
            cat extension/dist/.release-skipped
            echo "::warning title=Release check skipped::there is no release package to check while the locked WASM package is behind"
          else
            bash scripts/check-ext-release.sh
          fi
      - name: Checksums of the unsigned packages
        if: hashFiles('extension/dist/.release-skipped') == ''
        working-directory: extension/dist
        run: sha256sum ferret-firefox-*-release.xpi | tee SHA256SUMS
      - name: Keep the unsigned packages
        if: hashFiles('extension/dist/.release-skipped') == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferret-extension-unsigned
          path: |
            extension/dist/ferret-firefox-*-release.xpi
            extension/dist/SHA256SUMS
          if-no-files-found: error
