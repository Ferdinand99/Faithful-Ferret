# The web vault (web/): build against the published WASM package (or, while the lock is
# behind the core in the tree, the package built from this commit: wasm-tree.yml), type
# check, unit tests, and the page under the strict CSP and Trusted Types in Chromium,
# Firefox and WebKit. Third-party actions are pinned by commit SHA, the
# Playwright image by digest. The workflow has read access only and never uses
# `pull_request_target`.
name: Web

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wasm:
    name: WASM package
    uses: ./.github/workflows/wasm-tree.yml

  unit:
    name: Build, types and unit tests
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Playwright 1.65.1 on Ubuntu 24.04. Keep the tag and the digest in step
      # with web/package.json and scripts/lanbox-web.sh.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    env:
      HOME: /root
      CI: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the locked packages
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: The WASM package of this commit
        if: needs.wasm.outputs.source == 'tree'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-tree
          path: wasm-package
      - name: Build (the package of this commit, or the published one checked against its SHA-256)
        env:
          WASM_SOURCE: ${{ needs.wasm.outputs.source }}
        run: |
          if [ "$WASM_SOURCE" = tree ]; then
            node scripts/build.mjs --wasm tree --wasm-tar ../wasm-package/ferret-core-wasm-web-*.tar.gz \
              --wasm-commit "$(node -p "JSON.parse(require('fs').readFileSync('../wasm-package/wasm-tree.json', 'utf8')).commit")"
          else
            node scripts/build.mjs
          fi
      - name: Type check
        run: npx tsc -p jsconfig.json --noEmit
      - name: Unit tests
        run: node --test "test/unit/*.test.mjs"

  e2e:
    name: Page under the CSP (${{ matrix.browser }})
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --shm-size=2gb
    env:
      HOME: /root
      CI: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the locked packages
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: The WASM package of this commit
        if: needs.wasm.outputs.source == 'tree'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-tree
          path: wasm-package
      - name: Build
        env:
          WASM_SOURCE: ${{ needs.wasm.outputs.source }}
        run: |
          if [ "$WASM_SOURCE" = tree ]; then
            node scripts/build.mjs --wasm tree --wasm-tar ../wasm-package/ferret-core-wasm-web-*.tar.gz \
              --wasm-commit "$(node -p "JSON.parse(require('fs').readFileSync('../wasm-package/wasm-tree.json', 'utf8')).commit")"
          else
            node scripts/build.mjs
          fi
      - name: Run the tests in ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
      # The screenshots of the menu in both themes, for a look at what the browsers drew. Not part of the repository.
      - name: Keep the screenshots of the menu
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: menu-screenshots-${{ matrix.browser }}
          path: web/test-results/**/shell-*.png
          if-no-files-found: ignore
          retention-days: 7
